                    const facing = entity?.facing || machine.status?.facing;
                    const isTurtle = machine.type && (machine.type === 'turtle' || machine.type.endsWith('_turtle'));
                    if (isTurtle && facing && facing !== 'unknown') {
                        // Create an arrow pointing in the facing direction
                        // Cube is BoxGeometry(1,1,1) centered at origin, offset by (0.5,0.5,0.5)
                        // So cube extends from (0,0,0) to (1,1,1) in group space, top is at y=1.0
                        // Cone height is 0.8, we want half (0.4) above the cube top
                        // Cone center should be at 1.0 + 0.4 = 1.4 (so 0.4 sticks out, 0.4 is inside)
                        const arrowGeometry = new THREE.ConeGeometry(0.2, 0.8, 8);
                        const arrowMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });
                        const arrow = new THREE.Mesh(arrowGeometry, arrowMaterial);
                        arrow.position.set(0.5, 1.4, 0.5); // Center at cube center (x,z) and at 1.4 (y) so half sticks out
                        // Rotate cone to point horizontally (cone normally points up along Y axis)
                        arrow.rotation.x = -Math.PI / 2; // Rotate 90 degrees to point forward (north/-Z)
                        // Rotate around Z axis based on facing direction
                        const facingRotation = getFacingRotation(facing);
                        arrow.rotation.z = facingRotation; // Rotate in the facing direction
                        group.add(arrow);
                    }
                    
                    // Position at block coordinates (blocks align by corner, not center)
                    // For androids, adjust Y position down by 1 block since they're rendered 1 block too high
                    if (machine.type === 'android') {
                        group.position.set(position.x, position.y - 1, position.z);
                    } else {
                        group.position.set(position.x, position.y, position.z);
                    }
                    scene.add(group);
                    machineMeshes.set(id, group);
                }
            });
            
            // Update selection indicator
            updateSelectionIndicator();
        }

        // Center camera on machine
        function centerCameraOnMachine(machineId) {
            const machine = machines.get(machineId);
            if (!machine) {
                console.warn('Cannot center camera: machine not found', machineId);
                return;
            }
            
            // Get position directly from machine status (the one shown in the card)
            const position = machine.status?.position;
            
            if (!position || position === 'unknown' || typeof position !== 'object') {
                console.warn('Cannot center camera: machine position unknown', machineId, position);
                return;
            }
            
            // Target position is the agent's position (center of the agent)
            // For androids, position is at feet, so center is at y + 0.9 (half of 1.8 height)
            // For turtles/computers, position is at block corner, so center is at y + 0.5
            let targetY = position.y;
            if (machine.type === 'android') {
                targetY = position.y + 0.9; // Center of android (1.8 blocks tall)
            } else {
                targetY = position.y + 0.5; // Center of 1x1x1 block
            }
            
            const targetPosition = new THREE.Vector3(
                position.x,
                targetY,
                position.z
            );
            
            // Position camera: 3 blocks above, 10 blocks behind (in -Z direction, which is "north" in Minecraft)
            // In Three.js, +Z is typically "forward" in the scene, so "behind" would be -Z
            // Camera will be at z-10 (behind/north of agent)
            const cameraOffset = new THREE.Vector3(0, 3, -10); // 3 blocks up, 10 blocks behind (north)
            
            // Set camera position
            cameraPosition.x = targetPosition.x + cameraOffset.x;
            cameraPosition.y = targetPosition.y + cameraOffset.y;
            cameraPosition.z = targetPosition.z + cameraOffset.z;
            
            // Update camera immediately
            camera.position.set(cameraPosition.x, cameraPosition.y, cameraPosition.z);
            camera.lookAt(targetPosition.x, targetPosition.y, targetPosition.z);
            
            // Extract rotation from the camera's look direction
            // Calculate the direction vector from camera to target (not from target to camera)
            const cameraToTarget = new THREE.Vector3();
            cameraToTarget.subVectors(targetPosition, camera.position);
            cameraToTarget.normalize();
            
            // Calculate rotation angles from the direction vector
            // updateCamera uses: lookAt = position + (sin(y)*cos(x), -sin(x), -cos(y)*cos(x))
            // So direction = (sin(y)*cos(x), -sin(x), -cos(y)*cos(x))
            // From this: 
            //   -sin(x) = direction.y  =>  x = -asin(direction.y)
            //   sin(y)*cos(x) = direction.x  =>  y = atan2(direction.x, -direction.z) (using cos(y) from z component)
            cameraRotation.x = -Math.asin(cameraToTarget.y);
            cameraRotation.y = Math.atan2(cameraToTarget.x, -cameraToTarget.z);
            
            // Clamp rotation to valid range
            cameraRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraRotation.x));
            
            // Save camera state after centering
            saveCameraState();
            
            console.log('Camera centered on machine', machineId, 'at', targetPosition, 'camera at', cameraPosition);
        }

        // Update background color based on game time
        // Time range: 0-23999 ticks
        // 0 = sunrise (6 AM), 6000 = noon (12 PM), 12000 = sunset (6 PM), 18000 = midnight (12 AM)
        function updateBackgroundColor(time) {
            if (time === null || time === undefined) return;
            
            let color;
            const normalizedTime = time % 24000; // Ensure it's in 0-23999 range
            
            if (normalizedTime < 6000) {
                // 0-6000: Sunrise to noon (6 AM - 12 PM) - Light blue to bright blue
                const t = normalizedTime / 6000; // 0 to 1
                color = new THREE.Color().lerpColors(
                    new THREE.Color(0x87ceeb), // Light sky blue (sunrise)
                    new THREE.Color(0x4fc3f7), // Bright blue (noon)
                    t
                );
            } else if (normalizedTime < 12000) {
                // 6000-12000: Noon to sunset (12 PM - 6 PM) - Bright blue to orange
                const t = (normalizedTime - 6000) / 6000; // 0 to 1
                color = new THREE.Color().lerpColors(
                    new THREE.Color(0x4fc3f7), // Bright blue (noon)
                    new THREE.Color(0xff7043), // Orange (sunset)
                    t
                );
            } else if (normalizedTime < 18000) {
                // 12000-18000: Sunset to midnight (6 PM - 12 AM) - Orange to dark purple
                const t = (normalizedTime - 12000) / 6000; // 0 to 1
                color = new THREE.Color().lerpColors(
                    new THREE.Color(0xff7043), // Orange (sunset)
                    new THREE.Color(0x1a237e), // Dark blue/purple (midnight)
                    t
                );
            } else {
                // 18000-24000: Midnight to sunrise (12 AM - 6 AM) - Dark to light blue
                const t = (normalizedTime - 18000) / 6000; // 0 to 1
                color = new THREE.Color().lerpColors(
                    new THREE.Color(0x1a237e), // Dark blue/purple (midnight)
                    new THREE.Color(0x87ceeb), // Light sky blue (sunrise)
                    t
                );
            }
            
            scene.background.copy(color);
        }
        
        // Poll for game time from connected machines
        function pollGameTime() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            // Find a random connected machine to poll
            const machineIds = Array.from(machines.keys());
            if (machineIds.length > 0) {
                // Time is already included in status updates, so we just need to ensure
                // we're getting regular status updates. The status updates already include time.
                // If no time is available, we could request a status update, but for now
                // we'll just rely on the regular status broadcasts.
            }
        }
        
        // WebSocket connection
        function connect() {
            try {
                ws = new WebSocket(WS_URL);
                
                ws.onopen = () => {
                    console.log('Connected to server');
                    updateStatus(true);
                    
                    // Start polling for game time every 10 seconds
                    if (timePollInterval) clearInterval(timePollInterval);
                    timePollInterval = setInterval(pollGameTime, 10000);
                };
                
                ws.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    handleMessage(msg);
                };
                
                ws.onclose = () => {
                    console.log('Disconnected from server');
                    updateStatus(false);
                    if (timePollInterval) {
                        clearInterval(timePollInterval);
                        timePollInterval = null;
                    }
                    // Attempt to reconnect after 3 seconds
                    setTimeout(connect, 3000);
                };
                
                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    updateStatus(false);
                    if (timePollInterval) {
                        clearInterval(timePollInterval);
                        timePollInterval = null;
                    }
                };
            } catch (error) {
                console.error('Failed to connect:', error);
                updateStatus(false);
                setTimeout(connect, 3000);
            }
        }

        function updateStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                statusDot.classList.add('connected');
                statusDot.classList.remove('disconnected');
                statusText.textContent = 'Connected';
            } else {
                statusDot.classList.remove('connected');
                statusDot.classList.add('disconnected');
                statusText.textContent = 'Disconnected';
            }
        }

        function handleMessage(msg) {
            switch (msg.type) {
                case 'full_state':
                    machines.clear();
                    entities.clear();
                    machinePositionHistory.clear(); // Clear position history on full state sync
                    
                    // Store machines
                    if (msg.machines) {
                        msg.machines.forEach(m => {
                            machines.set(m.id, m);
                            
                            // Restore live mode intervals for machines that have liveMode enabled (not just androids)
                            if (m.liveMode && !androidLiveIntervals.has(m.id)) {
                                let frequency = m.liveFrequency || 8;
                                // Clamp to 19Hz max
                                if (frequency > 19) {
                                    frequency = 19;
                                }
                                const intervalMs = 1000 / frequency;
                                const intervalId = setInterval(() => {
                                    window.sendCommandToMachine(m.id, 'update', {});
                                }, intervalMs);
                                androidLiveIntervals.set(m.id, intervalId);
                                androidUpdateFrequencies.set(m.id, m.liveFrequency || 8); // Store UI value
                                console.log('Restored live mode for machine:', m.id, 'at', frequency, 'Hz (clamped)');
                            }
                        });
                    }
                    
                    // Store entities and initialize position history
                    if (msg.entities) {
                        const currentTime = performance.now();
                        msg.entities.forEach(e => {
                            entities.set(e.id, e);
                            // Initialize position history for interpolation (turtles only, not androids)
                            const machine = machines.get(e.id);
                            const isAndroid = machine?.type === 'android';
                            if (e.position && typeof e.position === 'object' && !isAndroid) {
                                interpolatePosition(e.id, e.position, currentTime);
                            }
                        });
                    }
                    
                    updateMachineList();
                    
                    // Extract game time from first available machine
                    if (msg.machines && msg.machines.length > 0) {
                        for (const m of msg.machines) {
                            // Check both msg.machines status and stored machines status
                            const storedMachine = machines.get(m.id);
                            const status = m.status || (storedMachine && storedMachine.status);
                            if (status && status.time !== undefined && status.time !== null) {
                                gameTime = status.time;
                                updateBackgroundColor(gameTime);
                                break;
                            }
                        }
                    }
                    
                    // Request chunks for all entities with positions
                    // Use a very large radius to load ALL stored chunks around entities
                    const requestedCenters = new Set();
                    entities.forEach((entity, id) => {
                        if (entity.position && typeof entity.position === 'object') {
                            const chunkX = Math.floor(entity.position.x / 16);
                            const chunkZ = Math.floor(entity.position.z / 16);
                            const key = `${chunkX},${chunkZ}`;
                            if (!requestedCenters.has(key)) {
                                requestedCenters.add(key);
                                // Request with very large radius (50 = 101x101 chunks = covers a huge area)
                                // This ensures we load ALL stored chunks near any entity
                                requestChunksInRadius('overworld', chunkX, chunkZ, 50);
                            }
                        }
                    });
                    break;
                    
                case 'state_update':
                    // Update entities
                    if (msg.entities) {
                        const currentTime = performance.now();
                        // Check for new entities with positions that we haven't requested chunks for yet
                        const newEntities = [];
                        msg.entities.forEach(e => {
                            if (!entities.has(e.id) && e.position && typeof e.position === 'object') {
                                newEntities.push(e);
                            }
                            // Get existing entity BEFORE updating, so we can compare positions
                            const existingEntity = entities.get(e.id);
                            
                            // Update entity
                            entities.set(e.id, e);
                            
                            // Update position history for interpolation when position changes (turtles only, not androids)
                            const machine = machines.get(e.id);
                            const isAndroid = machine?.type === 'android';
                            if (e.position && typeof e.position === 'object' && !isAndroid) {
                                if (!existingEntity || 
                                    !existingEntity.position ||
                                    existingEntity.position.x !== e.position.x ||
                                    existingEntity.position.y !== e.position.y ||
                                    existingEntity.position.z !== e.position.z) {
                                    // Position changed - update interpolation history
                                    interpolatePosition(e.id, e.position, currentTime);
                                }
                            }
                        });
                        
                        // Request chunks for any new entities
                        newEntities.forEach(entity => {
                            const chunkX = Math.floor(entity.position.x / 16);
                            const chunkZ = Math.floor(entity.position.z / 16);
                            // Request with large radius to get all nearby stored chunks
                            requestChunksInRadius('overworld', chunkX, chunkZ, 50);
                        });
                    }
                    
                    // Update machines if provided
                    if (msg.machines) {
                        // Track which machines were in the update and if any were added
                        const updatedMachineIds = new Set();
                        let hadNewMachines = false;
                        msg.machines.forEach(m => {
                            updatedMachineIds.add(m.id);
                            const existingMachine = machines.get(m.id);
                            const isNewMachine = !existingMachine;
                            
                            // Merge status if machine already exists
                            if (existingMachine && existingMachine.status && m.status) {
                                existingMachine.status = { ...existingMachine.status, ...m.status };
                            // Also merge liveMode and liveFrequency
                            existingMachine.liveMode = m.liveMode !== undefined ? m.liveMode : (existingMachine.liveMode || false);
                            existingMachine.liveFrequency = m.liveFrequency !== undefined ? m.liveFrequency : (existingMachine.liveFrequency || 8);
                            machines.set(m.id, existingMachine);
                            
                            // Restore live mode interval if server says it should be enabled
                            if (existingMachine.liveMode && !androidLiveIntervals.has(m.id)) {
                                let frequency = existingMachine.liveFrequency || 8;
                                // Clamp to 19Hz max
                                if (frequency > 19) {
                                    frequency = 19;
                                }
                                const intervalMs = 1000 / frequency;
                                const intervalId = setInterval(() => {
                                    window.sendCommandToMachine(m.id, 'update', {});
                                }, intervalMs);
                                androidLiveIntervals.set(m.id, intervalId);
                                console.log('Restored live mode for machine:', m.id, 'at', frequency, 'Hz (clamped)');
                            } else if (!existingMachine.liveMode && androidLiveIntervals.has(m.id)) {
                                // Stop live mode if server says it should be disabled
                                clearInterval(androidLiveIntervals.get(m.id));
                                androidLiveIntervals.delete(m.id);
                                console.log('Stopped live mode for machine:', m.id);
                            }
                        } else {
                            machines.set(m.id, m);
                            hadNewMachines = true;
                            
                            // Restore live mode interval for new machines
                            if (m.liveMode && !androidLiveIntervals.has(m.id)) {
                                const frequency = m.liveFrequency || 8;
                                const intervalMs = 1000 / frequency;
                                const intervalId = setInterval(() => {
                                    window.sendCommandToMachine(m.id, 'update', {});
                                }, intervalMs);
                                androidLiveIntervals.set(m.id, intervalId);
                                androidUpdateFrequencies.set(m.id, frequency);
                                console.log('Restored live mode for android:', m.id, 'at', frequency, 'Hz');
                            }
                        }
                            
                            // Update game time if available (check both m.status and merged status)
                            const status = m.status || (existingMachine && existingMachine.status);
                            if (status && status.time !== undefined && status.time !== null) {
                                gameTime = status.time;
                                updateBackgroundColor(gameTime);
                            }
                        });
                        
                        // Remove machines that are no longer in the state
                        const machinesToRemove = [];
                        machines.forEach((machine, id) => {
                            if (!updatedMachineIds.has(id)) {
                                machinesToRemove.push(id);
                            }
                        });
                        const hadMachinesRemoved = machinesToRemove.length > 0;
                        machinesToRemove.forEach(id => {
                            machines.delete(id);
                            entities.delete(id);
                            // Clear pathfinding visualization
                            clearPathfindingVisualization(id);
                            // Clear selection if disconnected machine was selected
                            if (selectedMachineId === id) {
                                selectedMachineId = null;
                            }
                            // Clear live interval if machine disconnects
                            if (androidLiveIntervals.has(id)) {
                                clearInterval(androidLiveIntervals.get(id));
                                androidLiveIntervals.delete(id);
                            }
                        });
                        
                        // Only update list if machines were added or removed
                        if (hadMachinesRemoved || hadNewMachines) {
                            updateMachineList();
                        }
                    }
                    
                    // Handle chunk update
                    if (msg.world && msg.chunk) {
                        requestChunk(msg.world, msg.chunk.x, msg.chunk.z);
                    }
                    
                    // Update individual machine card fields (fuel, button states, position) without full re-render
                    if (msg.machines && msg.machines.length > 0) {
                        updateMachineCardFields(msg.machines);
                    }
                    
                    // Don't re-render the entire list on every status update - this causes flickering
                    // Only update meshes, the list will be updated when machines are added/removed (full_state)
                    // Note: updateMachineMeshes() recreates all meshes which is expensive
                    // Positions are updated via updateMachineMeshPositions() in the animation loop
                    // Individual machine updates are handled by the 'machine_update' case above
                    // So we don't need to call updateMachineMeshes() on every state update
                    break;
                
                case 'chunk_response':
                    console.log('Received chunk_response:', msg.chunks?.length, 'chunks');
                    if (msg.chunks && Array.isArray(msg.chunks)) {
                        msg.chunks.forEach(chunk => {
                            const chunkKey = `${chunk.dimension || 'overworld'},${chunk.x},${chunk.z}`;
                            console.log('Processing chunk:', chunkKey, 'blocks:', chunk.data?.length);
                            console.log('Chunk data structure:', {
                                hasData: !!chunk.data,
                                isArray: Array.isArray(chunk.data),
                                dataLength: chunk.data?.length,
                                firstBlock: chunk.data?.[0]
                            });
                            // Always update the chunk in our map and render it (even if we've seen it before)
                            chunks.set(chunkKey, chunk);
                            // Force re-render by calling updateChunkMesh
                            updateChunkMesh(chunk);
                        });
                    } else {
                        console.warn('chunk_response received but msg.chunks is missing or empty');
                    }
                    break;

                case 'terminal_update':
                    if (msg.machineId && msg.data) {
                        // Append terminal output for this machine
                        if (!terminalOutput.has(msg.machineId)) {
                            terminalOutput.set(msg.machineId, '');
                        }
                        const currentOutput = terminalOutput.get(msg.machineId);
                        terminalOutput.set(msg.machineId, currentOutput + msg.data);
                        
                        // Update terminal display if this machine is selected and terminal is visible
                        if (selectedMachineId === msg.machineId && terminalPanelVisible) {
                            updateTerminalDisplay(msg.machineId);
                        }
                    }
                    break;
                
                case 'machine_update':
                    // Handle individual machine update (much more efficient than full state)
                    if (msg.machine && msg.machine.id) {
                        const machineId = msg.machine.id;
                        
                        // Update machine in our state
                        const existingMachine = machines.get(machineId);
                        const hadLiveMode = existingMachine?.liveMode || false;
                        const hadLiveFrequency = existingMachine?.liveFrequency || 8;
                        
                        if (existingMachine) {
                            // Merge updates into existing machine (deep merge to preserve all fields)
                            if (msg.machine.status) {
                                // Ensure status object exists
                                if (!existingMachine.status) {
                                    existingMachine.status = {};
                                }
                                // Deep merge status to ensure all fields are preserved
                                existingMachine.status = { 
                                    ...existingMachine.status, 
                                    ...msg.machine.status 
                                };
                                // Explicitly update key fields to ensure they're not lost
                                if (msg.machine.status.position !== undefined) {
                                    existingMachine.status.position = msg.machine.status.position;
                                }
                                if (msg.machine.status.facing !== undefined) {
                                    existingMachine.status.facing = msg.machine.status.facing;
                                }
                                if (msg.machine.status.fuel !== undefined) {
                                    existingMachine.status.fuel = msg.machine.status.fuel;
                                }
                                if (msg.machine.status.status !== undefined) {
                                    existingMachine.status.status = msg.machine.status.status;
                                }
                            }
                            if (msg.machine.capabilities) {
                                existingMachine.capabilities = msg.machine.capabilities;
                            }
                            if (msg.machine.liveMode !== undefined) {
                                existingMachine.liveMode = msg.machine.liveMode;
                            }
                            if (msg.machine.liveFrequency !== undefined) {
                                existingMachine.liveFrequency = msg.machine.liveFrequency;
                            }
                        } else {
                            // New machine - add it
                            machines.set(machineId, msg.machine);
                            
                            // Add the new machine card to the DOM without refreshing the whole list
                            addMachineCardToDOM(machineId);
                        }
                        
                        // Handle live mode changes
                        const newLiveMode = msg.machine.liveMode || false;
                        const newLiveFrequency = msg.machine.liveFrequency || 8;
                        
                        if (newLiveMode && !hadLiveMode && !androidLiveIntervals.has(machineId)) {
                            // Start live mode
                            let frequency = newLiveFrequency;
                            // Clamp to 19Hz max
                            if (frequency > 19) {
                                frequency = 19;
                            }
                            const intervalMs = 1000 / frequency;
                            const intervalId = setInterval(() => {
                                window.sendCommandToMachine(machineId, 'update', {});
                            }, intervalMs);
                            androidLiveIntervals.set(machineId, intervalId);
                            androidUpdateFrequencies.set(machineId, newLiveFrequency);
                            console.log('Started live mode for machine:', machineId, 'at', frequency, 'Hz (clamped)');
                        } else if (!newLiveMode && hadLiveMode && androidLiveIntervals.has(machineId)) {
                            // Stop live mode
                            clearInterval(androidLiveIntervals.get(machineId));
                            androidLiveIntervals.delete(machineId);
                            androidUpdateFrequencies.delete(machineId);
                            console.log('Stopped live mode for machine:', machineId);
                        } else if (newLiveMode && hadLiveMode && newLiveFrequency !== hadLiveFrequency) {
                            // Update frequency
                            clearInterval(androidLiveIntervals.get(machineId));
                            let frequency = newLiveFrequency;
                            if (frequency > 19) {
                                frequency = 19;
                            }
                            const intervalMs = 1000 / frequency;
                            const intervalId = setInterval(() => {
                                window.sendCommandToMachine(machineId, 'update', {});
                            }, intervalMs);
                            androidLiveIntervals.set(machineId, intervalId);
                            androidUpdateFrequencies.set(machineId, newLiveFrequency);
                            console.log('Updated live mode frequency for machine:', machineId, 'to', frequency, 'Hz (clamped)');
                        }
                        
                        // Update entity if provided
                        if (msg.entity) {
                            entities.set(machineId, msg.entity);
                            // Feed position to interpolation system for smooth movement (turtles only, not androids)
                            const machine = machines.get(machineId);
                            const isAndroid = machine?.type === 'android';
                            if (msg.entity.position && typeof msg.entity.position === 'object' && !isAndroid) {
                                interpolatePosition(machineId, msg.entity.position, performance.now());
                            }
                        } else if (msg.machine.status?.position || msg.machine.status?.facing !== undefined) {
                            // Update entity from machine status if entity not provided
                            const existingEntity = entities.get(machineId);
                            const newEntity = {
                                id: machineId,
                                type: msg.machine.type,
                                position: msg.machine.status.position ?? existingEntity?.position ?? null,
                                facing: msg.machine.status.facing !== undefined ? msg.machine.status.facing : (existingEntity?.facing ?? null)
                            };
                            entities.set(machineId, newEntity);
                            // Feed position to interpolation system for smooth movement (turtles only, not androids)
                            const machine = machines.get(machineId);
                            const isAndroid = machine?.type === 'android';
                            if (newEntity.position && typeof newEntity.position === 'object' && !isAndroid) {
                                interpolatePosition(machineId, newEntity.position, performance.now());
                            }
                        }
                        
                        // Update pathfinding visualization if path is provided
                        if (msg.pathfindingPath && Array.isArray(msg.pathfindingPath)) {
                            updatePathfindingVisualization(machineId, msg.pathfindingPath);
                        } else {
                            // Clear path visualization if no path
                            clearPathfindingVisualization(machineId);
                        }
                        
                        // Update the specific machine card
                        updateMachineCardFields([msg.machine]);
                        
                        // Update only this machine's mesh (much more efficient)
                        updateSingleMachineMesh(machineId);
                        
                        // Update game time if available
                        if (msg.machine.status?.time !== undefined && msg.machine.status?.time !== null) {
                            gameTime = msg.machine.status.time;
                            updateBackgroundColor(gameTime);
                        }
                    }
                    break;
            }
        }

        function updateMachineList() {
            const container = document.getElementById('machineList');
            
            if (machines.size === 0 && entities.size === 0) {
                container.innerHTML = '<div class="empty-state">No machines connected</div>';
                return;
            }
            
            // Combine machines and entities data
            const allMachines = Array.from(machines.values()).map(machine => {
                const entity = entities.get(machine.id);
                return {
                    ...machine,
                    position: entity?.position || machine.status?.position,
                    facing: entity?.facing || machine.status?.facing,
                    fuel: machine.status?.fuel,
                    capabilities: machine.capabilities || {},
                    status: {
                        ...machine.status,
                        label: machine.status?.label
                    }
                };
            });
            
            container.innerHTML = allMachines.map(machine => createMachineCard(machine)).join('');
            updateMachineMeshes();
        }
        
        // Add a new machine card to the DOM (without refreshing the whole list)
        function addMachineCardToDOM(machineId) {
            const machine = machines.get(machineId);
            if (!machine) return;
            
            const container = document.getElementById('machineList');
            if (!container) return;
            
            // Check if card already exists
            const existingCard = container.querySelector(`[data-machine-id="${machineId}"]`);
            if (existingCard) return;
            
            // Remove empty state message if present
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
            
            // Get entity data for the machine
            const entity = entities.get(machineId);
            const machineData = {
                ...machine,
                position: entity?.position || machine.status?.position,
                facing: entity?.facing || machine.status?.facing,
                fuel: machine.status?.fuel,
                capabilities: machine.capabilities || {},
                status: {
                    ...machine.status,
                    label: machine.status?.label
                }
            };
            
            // Create the card HTML
            const cardHTML = createMachineCard(machineData);
            
            // Create a temporary container to parse the HTML
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = cardHTML;
            const newCard = tempDiv.firstElementChild;
            
            // Insert the new card at the end of the list
            container.appendChild(newCard);
            
            // Create the 3D mesh for the new machine
            updateSingleMachineMesh(machineId);
            
            // Re-setup click handlers (they might need to be reattached)
            setupMachineListClickHandler();
            
            console.log('Added new machine card for', machineId);
        }
        
        // Update individual machine card fields when status updates arrive
        function updateMachineCardFields(updatedMachines) {
            updatedMachines.forEach(machine => {
                const machineItem = document.querySelector(`[data-machine-id="${machine.id}"]`);
                if (!machineItem) {
                    // Card doesn't exist yet, try to add it
                    if (machines.has(machine.id)) {
                        addMachineCardToDOM(machine.id);
                    }
                    return;
                }
                
                const storedMachine = machines.get(machine.id);
                if (!storedMachine) {
                    console.warn(`updateMachineCardFields: No stored machine found for ${machine.id}`);
                    return;
                }
                
                // Use merged status from storedMachine (which has been updated in machine_update handler)
                // Also merge with the incoming machine data to ensure we have the latest
                const incomingStatus = machine.status || {};
                const storedStatus = storedMachine.status || {};
                const mergedStatus = { ...storedStatus, ...incomingStatus };
                
                // Debug logging
                if (mergedStatus.fuel !== undefined || mergedStatus.position || mergedStatus.facing !== undefined) {
                    console.log(`Updating card for machine ${machine.id}:`, {
                        fuel: mergedStatus.fuel,
                        position: mergedStatus.position,
                        facing: mergedStatus.facing,
                        status: mergedStatus.status
                    });
                }
                
                // Update fuel value (including 0)
                if (mergedStatus.fuel !== undefined && mergedStatus.fuel !== null) {
                    // Find fuel element by looking for the one after "Fuel" label
                    const infoItems = machineItem.querySelectorAll('.info-item');
                    infoItems.forEach(item => {
                        const label = item.querySelector('.info-label');
                        if (label && label.textContent === 'Fuel') {
                            const value = item.querySelector('.info-value');
                            if (value) {
                                value.textContent = mergedStatus.fuel.toString();
                            }
                        }
                    });
                }
                
                // Update refuel button state
                const hasFuelItems = mergedStatus.hasFuelItems !== undefined 
                    ? mergedStatus.hasFuelItems 
                    : false;
                const refuelButton = machineItem.querySelector('.machine-actions button[onclick*="refuel"]');
                if (refuelButton) {
                    if (hasFuelItems) {
                        refuelButton.removeAttribute('disabled');
                        refuelButton.title = 'Refuel using fuel items in inventory';
                    } else {
                        refuelButton.setAttribute('disabled', 'disabled');
                        refuelButton.title = 'No fuel items in inventory';
                    }
                }
                
                // Update status display
                if (mergedStatus.status) {
                    const statusElement = machineItem.querySelector('.info-value.status-idle, .info-value.status-busy, .info-value.status-moving');
                    if (statusElement) {
                        statusElement.className = `info-value status-${mergedStatus.status}`;
                        statusElement.textContent = mergedStatus.status.toUpperCase();
                    }
                }
                
                // Update position display
                const entity = entities.get(machine.id);
                const position = entity?.position || mergedStatus.position || storedMachine.status?.position;
                
                // Always update position if we have it
                if (position && typeof position === 'object' && position !== 'unknown') {
                    const positionStr = `${Math.floor(position.x)}, ${Math.floor(position.y)}, ${Math.floor(position.z)}`;
                    const infoItems = machineItem.querySelectorAll('.info-item');
                    infoItems.forEach(item => {
                        const label = item.querySelector('.info-label');
                        if (label && label.textContent === 'Position') {
                            const valueContainer = item.querySelector('.info-value');
                            if (valueContainer) {
                                // Update the text content (preserving the edit icon)
                                const editIcon = valueContainer.querySelector('.edit-icon');
                                valueContainer.innerHTML = positionStr + (editIcon ? editIcon.outerHTML : '');
                            }
                        }
                    });
                }
                
                // Update facing display (always update if we have a value, including "unknown")
                const facing = entity?.facing ?? mergedStatus.facing ?? storedMachine.status?.facing;
                if (facing !== undefined && facing !== null) {
                    const infoItems = machineItem.querySelectorAll('.info-item');
                    infoItems.forEach(item => {
                        const label = item.querySelector('.info-label');
                        if (label && label.textContent === 'Facing') {
                            const value = item.querySelector('.info-value');
                            if (value) {
                                value.textContent = facing !== 'unknown' ? facing.toUpperCase() : 'unknown';
                                value.className = `info-value ${facing === 'unknown' ? 'unknown' : ''}`;
                            }
                        }
                    });
                }
            });
        }
        
        // Set up event delegation for machine list clicks (only once)
        let machineListClickHandlerSetup = false;
        function setupMachineListClickHandler() {
            if (machineListClickHandlerSetup) return;
            machineListClickHandlerSetup = true;
            
            const container = document.getElementById('machineList');
            container.addEventListener('click', (event) => {
                // Find the closest machine-item parent
                const machineItem = event.target.closest('.machine-item');
                if (machineItem) {
                    // Check if click was on a button or edit icon (these should not trigger selection)
                    if (event.target.closest('.btn-icon') || event.target.closest('.edit-icon') || event.target.closest('button')) {
                        return; // Let the button's own handler deal with it
                    }
                    
                    // Extract machine ID from the element's data attribute
                    const machineId = machineItem.dataset.machineId;
                    
                    if (machineId) {
                        event.preventDefault();
                        event.stopPropagation();
                        // Single click only (double click handled separately)
                        if (event.detail === 1) {
                            window.selectMachine(machineId);
                        }
                    }
                }
            });
            
            container.addEventListener('dblclick', (event) => {
                const machineItem = event.target.closest('.machine-item');
                if (machineItem) {
                    if (event.target.closest('.btn-icon') || event.target.closest('.edit-icon') || event.target.closest('button')) {
                        return;
                    }
                    const machineId = machineItem.dataset.machineId;
                    if (machineId) {
                        event.preventDefault();
                        event.stopPropagation();
                        window.centerOnMachine(machineId);
                    }
                }
            });
        }

        // Global function for button onclick handlers
        window.sendCommandToMachine = function(machineId, command, args = {}) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.error('WebSocket not connected');
                return;
            }
            
            console.log('sendCommandToMachine called:', { machineId, command, args });
            ws.send(JSON.stringify({
                type: 'command',
                target: machineId,
                command: command,
                args: args
            }));
        };

        // Global function to set machine label
        window.setMachineLabel = function(machineId, label) {
            window.sendCommandToMachine(machineId, 'setLabel', {label: label});
        };
        
        // Global function to disconnect a machine
        window.disconnectMachine = function(machineId) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.error('WebSocket not connected');
                return;
            }
            
            ws.send(JSON.stringify({
                type: 'disconnect_machine',
                target: machineId
            }));
        };
        
        // Global function to shutdown server
        window.shutdownServer = function() {
            if (!confirm('Are you sure you want to shutdown the server?')) {
                return;
            }
            
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.error('WebSocket not connected');
                return;
            }
            
            ws.send(JSON.stringify({
                type: 'shutdown_server'
            }));
        };
        
        // Global function to disconnect a machine
        window.disconnectMachine = function(machineId) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.error('WebSocket not connected');
                return;
            }
            
            ws.send(JSON.stringify({
                type: 'disconnect_machine',
                target: machineId
            }));
        };
        
        // Global function to shutdown server
        window.shutdownServer = function() {
            if (!confirm('Are you sure you want to shutdown the server?')) {
                return;
            }
            
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.error('WebSocket not connected');
                return;
            }
            
            ws.send(JSON.stringify({
                type: 'shutdown_server'
            }));
        };

        // Global function to start editing position
        window.startEditPosition = function(machineId) {
            const machine = machines.get(machineId);
            if (!machine) return;
            
            const currentPosition = machine.position && machine.position !== 'unknown' 
                ? machine.position 
                : { x: 0, y: 64, z: 0 };
            
            const x = prompt(`Enter X coordinate:`, Math.floor(currentPosition.x));
            if (x === null) return; // User cancelled
            
            const y = prompt(`Enter Y coordinate:`, Math.floor(currentPosition.y));
            if (y === null) return; // User cancelled
            
            const z = prompt(`Enter Z coordinate:`, Math.floor(currentPosition.z));
            if (z === null) return; // User cancelled
            
            const newX = parseInt(x);
            const newY = parseInt(y);
            const newZ = parseInt(z);
            
            if (isNaN(newX) || isNaN(newY) || isNaN(newZ)) {
                alert('Invalid coordinates. Please enter numbers only.');
                return;
            }
            
            // Send set_position command
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.error('WebSocket not connected');
                return;
            }
            
            ws.send(JSON.stringify({
                type: 'set_position',
                target: machineId,
                position: { x: newX, y: newY, z: newZ }
            }));
        };
        
        // Global function to start editing label
        window.startEditLabel = function(machineId) {
            const nameDisplay = document.getElementById(`nameDisplay_${machineId}`);
            const nameContainer = document.getElementById(`nameContainer_${machineId}`);
            
            if (!nameDisplay || !nameContainer) return;
            
            const currentText = nameDisplay.textContent;
            const machine = machines.get(machineId);
            const currentLabel = machine?.status?.label || '';
            
            // Create input element
            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentLabel;
            input.style.cssText = 'flex: 1; padding: 4px 8px; background: #222; border: 1px solid #4a9eff; border-radius: 4px; color: #e0e0e0; font-size: 16px; font-weight: bold; font-family: inherit;';
            
            const finishEdit = () => {
                const newLabel = input.value;
                nameContainer.innerHTML = '';
                nameContainer.innerHTML = `<span id="nameDisplay_${machineId}">${newLabel || (machine?.type?.replace('_', ' ') + ' #' + machineId)}</span><span class="edit-icon" id="editIcon_${machineId}" onclick="event.stopPropagation(); window.startEditLabel('${machineId}')" title="Edit name">✏️</span>`;
                
                if (newLabel !== currentLabel) {
                    window.setMachineLabel(machineId, newLabel);
                }
            };
            
            input.onblur = finishEdit;
            input.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    finishEdit();
                } else if (e.key === 'Escape') {
                    nameContainer.innerHTML = '';
                    nameContainer.innerHTML = `<span id="nameDisplay_${machineId}">${currentText}</span><span class="edit-icon" id="editIcon_${machineId}" onclick="event.stopPropagation(); window.startEditLabel('${machineId}')" title="Edit name">✏️</span>`;
                }
            };
            
            // Replace display with input
            nameContainer.innerHTML = '';
            nameContainer.appendChild(input);
            input.focus();
            input.select();
        };

        function createMachineCard(machine) {
            const position = machine.position;
            // For display, always truncate coordinates to integers
            const positionStr = position && position !== 'unknown' 
                ? `${Math.floor(position.x)}, ${Math.floor(position.y)}, ${Math.floor(position.z)}`
                : 'unknown';
            
            // Get facing from status (for turtles) or entity
            const machineFacing = machine.status?.facing || entities.get(machine.id)?.facing || null;
            const facingStr = machineFacing && machineFacing !== 'unknown'
                ? machineFacing.toUpperCase()
                : 'unknown';
            
            // Get fuel from status for turtles and androids
            const machineFuel = machine.status?.fuel !== undefined && machine.status.fuel !== null
                ? machine.status.fuel
                : (machine.fuel !== undefined && machine.fuel !== null ? machine.fuel : null);
            const fuelStr = machineFuel !== null && machineFuel !== undefined
                ? machineFuel.toString()
                : 'N/A';
            
            const hasFuelItems = machine.status?.hasFuelItems !== undefined ? machine.status.hasFuelItems : (machine.capabilities?.hasFuelItems || false);
            // Check if machine is a turtle (any type ending in "_turtle" or just "turtle")
            const isTurtle = machine.type && (machine.type === 'turtle' || machine.type.endsWith('_turtle'));
            const isAndroid = machine.type === 'android';
            const canRefuel = (isTurtle || isAndroid) && (machine.capabilities?.refuel !== false);
            const canUpdate = (isTurtle || isAndroid) && (machine.capabilities?.update !== false);
            const isSelected = selectedMachineId === machine.id;
            
            const currentLabel = machine.status?.label || '';
            return `
                <div class="machine-item ${isSelected ? 'selected' : ''}" 
                     data-machine-id="${machine.id}"
                     style="cursor: pointer;">
                    <div class="machine-header">
                        <span class="machine-name" id="nameContainer_${machine.id}">
                            <span id="nameDisplay_${machine.id}">${currentLabel || (machine.type.replace('_', ' ') + ' #' + machine.id)}</span>
                            <span class="edit-icon" id="editIcon_${machine.id}" onclick="event.stopPropagation(); window.startEditLabel('${machine.id}')" title="Edit name">✏️</span>
                        </span>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <button class="btn-icon" onclick="event.stopPropagation(); window.sendCommandToMachine('${machine.id}', 'reboot', {})" title="Reboot machine">🔄</button>
                            <button class="btn-icon" onclick="event.stopPropagation(); window.disconnectMachine('${machine.id}')" title="Disconnect machine">⏏️</button>
                            <span class="machine-type ${machine.type}">${machine.type}</span>
                        </div>
                    </div>
                    <div class="machine-info">
                        <div class="info-item">
                            <span class="info-label">Status</span>
                            <span class="info-value status-${machine.status?.status || 'idle'}">${(machine.status?.status || 'idle').toUpperCase()}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Position</span>
                            <span class="info-value ${position === 'unknown' ? 'unknown' : ''}" style="display: flex; align-items: center; gap: 4px;">
                                ${positionStr}
                                <span class="edit-icon ${machine.type === 'android' ? 'disabled' : ''}" 
                                      id="editPositionIcon_${machine.id}" 
                                      onclick="event.stopPropagation(); ${machine.type === 'android' ? '' : `window.startEditPosition('${machine.id}')`}" 
                                      title="${machine.type === 'android' ? 'Androids always know their position' : 'Edit position'}">✏️</span>
                            </span>
                        </div>
                        ${machineFacing ? `
                        <div class="info-item">
                            <span class="info-label">Facing</span>
                            <span class="info-value ${machineFacing === 'unknown' ? 'unknown' : ''}">${facingStr}</span>
                        </div>
                        ` : ''}
                        ${(isTurtle || isAndroid) && machineFuel !== null && machineFuel !== undefined ? `
                        <div class="info-item">
                            <span class="info-label">Fuel</span>
                            <span class="info-value">${fuelStr}</span>
                        </div>
                        ` : ''}
                    </div>
                    ${isTurtle || isAndroid ? `
                    <div class="machine-actions" style="margin-top: 8px;">
                        ${canRefuel ? `
                        <button class="btn btn-primary" 
                                onclick="event.stopPropagation(); window.sendCommandToMachine('${machine.id}', 'refuel', {count: 'all'})"
                                ${!hasFuelItems ? 'disabled' : ''}
                                title="${hasFuelItems ? 'Refuel using fuel items in inventory' : 'No fuel items in inventory'}">
                            Refuel
                        </button>
                        ` : ''}
                        ${canUpdate ? `
                        <button class="btn btn-primary" 
                                onclick="event.stopPropagation(); window.sendCommandToMachine('${machine.id}', 'update', {checkFuel: true})"
                                title="${isAndroid ? 'Update fuel items check and report position' : 'Update fuel items check and scan blocks around turtle'}">
                            Update
                        </button>
                        ` : ''}
                        ${isAndroid ? `
                        <label style="display: flex; align-items: center; gap: 8px; margin-top: 8px; cursor: pointer;" onclick="event.stopPropagation();">
                            <input type="checkbox" id="liveCheckbox_${machine.id}" 
                                   onchange="event.stopPropagation(); window.toggleAndroidLive('${machine.id}', this.checked)"
                                   ${(machine.liveMode || androidLiveIntervals.has(machine.id)) ? 'checked' : ''}
                                   style="cursor: pointer;">
                            <span style="font-size: 13px;">Live</span>
                        </label>
                        ` : ''}
                    </div>
                    ` : ''}
                </div>
            `;
        }
        
        // Track last selected machine to detect when selection changes
        let lastSelectedMachineId = null;
        
        // Update turtle controls visibility
        function updateTurtleControls() {
            // Update coordinate inputs with current position
            if (selectedMachineId) {
                const machine = machines.get(selectedMachineId);
                const entity = entities.get(selectedMachineId);
                const position = entity?.position || machine?.status?.position;
                
                if (position && position !== 'unknown' && typeof position === 'object') {
                    const xInput = document.getElementById('turtleX');
                    const yInput = document.getElementById('turtleY');
                    const zInput = document.getElementById('turtleZ');
                    
                    if (xInput) xInput.value = Math.floor(position.x);
                    if (yInput) yInput.value = Math.floor(position.y);
                    if (zInput) zInput.value = Math.floor(position.z);
                }
            }
            const turtleControls = document.getElementById('turtleControls');
            const androidControls = document.getElementById('androidControls');
            
            if (!turtleControls || !androidControls) return;
            
            // Check if selection changed
            const selectionChanged = selectedMachineId !== lastSelectedMachineId;
            
            // Hide both by default
            turtleControls.classList.remove('visible');
            androidControls.classList.remove('visible');
            
            if (selectedMachineId) {
                const machine = machines.get(selectedMachineId);
                if (machine) {
                    const isTurtle = machine.type && (machine.type === 'turtle' || machine.type.endsWith('_turtle'));
                    const isAndroid = machine.type === 'android';
                    
                    if (isTurtle) {
                        turtleControls.classList.add('visible');
                        // Update button handlers to use selected machine
                        // Movement commands automatically trigger an update scan
                        // sendMoveThenUpdate is defined globally for keyboard shortcuts too
                        document.getElementById('btnForward').onclick = () => window.sendMoveThenUpdate(selectedMachineId, 'move', {direction: 'forward'});
                        document.getElementById('btnBack').onclick = () => window.sendMoveThenUpdate(selectedMachineId, 'move', {direction: 'back'});
                        document.getElementById('btnLeft').onclick = () => window.sendMoveThenUpdate(selectedMachineId, 'turn', {direction: 'left'});
                        document.getElementById('btnRight').onclick = () => window.sendMoveThenUpdate(selectedMachineId, 'turn', {direction: 'right'});
                        document.getElementById('btnUp').onclick = () => window.sendMoveThenUpdate(selectedMachineId, 'move', {direction: 'up'});
                        document.getElementById('btnDown').onclick = () => window.sendMoveThenUpdate(selectedMachineId, 'move', {direction: 'down'});
                        
                        // Update coordinate inputs with current position
                        const entityPos = entity?.position || machine?.status?.position;
                        if (entityPos && entityPos !== 'unknown' && typeof entityPos === 'object') {
                            const xInput = document.getElementById('turtleX');
                            const yInput = document.getElementById('turtleY');
                            const zInput = document.getElementById('turtleZ');
                            
                            if (xInput) xInput.value = Math.floor(entityPos.x);
                            if (yInput) yInput.value = Math.floor(entityPos.y);
                            if (zInput) zInput.value = Math.floor(entityPos.z);
                        }
                    } else if (isAndroid) {
                        androidControls.classList.add('visible');
                        // Only pre-fill coordinates when selection changes (not on every update)
                        if (selectionChanged) {
                            const position = machine.position || machine.status?.position;
                            if (position && typeof position === 'object') {
                                // Use truncated coordinates for the input fields
                                document.getElementById('androidX').value = Math.floor(position.x) || '';
                                document.getElementById('androidY').value = Math.floor(position.y) || '';
                                document.getElementById('androidZ').value = Math.floor(position.z) || '';
                            }
                        }
                        // Set the update frequency if we have one stored, otherwise default to 8
                        const updateFreqInput = document.getElementById('androidUpdateFreq');
                        if (updateFreqInput && selectionChanged) {
                            const storedFreq = androidUpdateFrequencies.get(selectedMachineId);
                            updateFreqInput.value = storedFreq || 8;
                        }
                    }
                }
            }
            
            // Update last selected machine ID
            lastSelectedMachineId = selectedMachineId;
        }

        // Global function for movement commands (used by both buttons and keyboard)
        window.sendMoveThenUpdate = function(machineId, command, args) {
            console.log('sendMoveThenUpdate called:', machineId, command, args);
            window.sendCommandToMachine(machineId, command, args);
            // Wait 500ms for movement to complete before sending update command
            setTimeout(() => {
                window.sendCommandToMachine(machineId, 'update', {});
            }, 500);
        };
        
        // Global functions for selection and camera control
        window.selectMachine = function(machineId) {
            const previousSelectedId = selectedMachineId;
            selectedMachineId = machineId;
            
            // Only update selection visual state without full re-render
            const container = document.getElementById('machineList');
            if (container) {
                // Remove selected class from previous machine item
                if (previousSelectedId) {
                    const prevItem = container.querySelector(`[data-machine-id="${previousSelectedId}"]`);
                    if (prevItem) {
                        prevItem.classList.remove('selected');
                    }
                }
                // Add selected class to new machine item
                if (machineId) {
                    const newItem = container.querySelector(`[data-machine-id="${machineId}"]`);
                    if (newItem) {
                        newItem.classList.add('selected');
                    }
                }
            }
            
            updateSelectionIndicator(); // This will also call updateTurtleControls()
            updateTurtleControls(); // Update control panel visibility
            
            // Update terminal display if terminal is visible
            if (terminalPanelVisible && machineId) {
                updateTerminalDisplay(machineId);
            }
        };
        
        window.centerOnMachine = function(machineId) {
            window.selectMachine(machineId);
            centerCameraOnMachine(machineId);
        };

        // Terminal display functions
        function updateTerminalDisplay(machineId) {
            const terminalContent = document.getElementById('terminalContent');
            const terminalTitle = document.getElementById('terminalTitle');
            
            if (!terminalContent || !terminalTitle) return;
            
            const machine = machines.get(machineId);
            if (machine) {
                const machineLabel = machine.status?.label || machine.type + ' #' + machineId;
                terminalTitle.textContent = `Terminal: ${machineLabel}`;
            }
            
            const output = terminalOutput.get(machineId) || '';
            terminalContent.textContent = output;
            
            // Auto-scroll to bottom
            terminalContent.scrollTop = terminalContent.scrollHeight;
        }

        window.toggleTerminal = function() {
            const terminalPanel = document.getElementById('terminalPanel');
            if (!terminalPanel) return;
            
            terminalPanelVisible = !terminalPanelVisible;
            
            if (terminalPanelVisible) {
                terminalPanel.classList.add('visible');
                // Update display for selected machine
                if (selectedMachineId) {
                    updateTerminalDisplay(selectedMachineId);
                }
            } else {
                terminalPanel.classList.remove('visible');
            }
        };

        // Handle Turtle facing direction set

        // Handle Turtle move button click
        window.moveTurtle = function() {
            if (!selectedMachineId) {
                console.log('No machine selected');
                return;
            }
            const machine = machines.get(selectedMachineId);
            if (!machine || (machine.type !== 'turtle' && !machine.type.endsWith('_turtle'))) {
                console.log('Selected machine is not a turtle:', machine?.type);
                return;
            }

            const xInput = document.getElementById('turtleX');
            const yInput = document.getElementById('turtleY');
            const zInput = document.getElementById('turtleZ');

            if (!xInput || !yInput || !zInput) {
                console.error('Coordinate inputs not found');
                return;
            }

            const x = parseInt(xInput.value);
            const y = parseInt(yInput.value);
            const z = parseInt(zInput.value);

            if (isNaN(x) || isNaN(y) || isNaN(z)) {
                alert('Please enter valid coordinates for X, Y, and Z');
                return;
            }

            console.log('Sending moveTo command to turtle:', { x, y, z });
            // Send moveTo command (server will handle pathfinding)
            window.sendCommandToMachine(selectedMachineId, 'moveTo', {
                x: x,
                y: y,
                z: z
            });
        };

        // Toggle Android live updates with custom frequency
        window.toggleAndroidLive = function(machineId, enabled) {
            console.log('toggleAndroidLive called:', machineId, enabled);
            // Clear existing interval if any
            if (androidLiveIntervals.has(machineId)) {
                clearInterval(androidLiveIntervals.get(machineId));
                androidLiveIntervals.delete(machineId);
            }

            // Get update frequency (Hz) from stored value or default to 8
            const frequency = androidUpdateFrequencies.get(machineId) || 8;
            
            // Notify server of live mode state change
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.error('WebSocket not connected');
                return;
            }
            
            ws.send(JSON.stringify({
                type: 'set_live_mode',
                target: machineId,
                enabled: enabled,
                frequency: frequency
            }));

            if (enabled) {
                const intervalMs = 1000 / frequency; // Convert Hz to milliseconds
                
                // Start live updates with the specified frequency
                const intervalId = setInterval(() => {
                    window.sendCommandToMachine(machineId, 'update', {});
                }, intervalMs);
                androidLiveIntervals.set(machineId, intervalId);
                console.log('Live updates started for android:', machineId, 'at', frequency, 'Hz');
            } else {
                console.log('Live updates stopped for android:', machineId);
            }
            
            // Update the machine list to reflect checkbox state change
            updateMachineList();
        };
        
        // Update Android update frequency
        window.updateAndroidFrequency = function(machineId) {
            const freqInput = document.getElementById('androidUpdateFreq');
            if (!freqInput) return;
            
            const frequency = parseInt(freqInput.value);
            if (isNaN(frequency) || frequency < 1 || frequency > 20) {
                alert('Update frequency must be between 1 and 20 Hz');
                return;
            }
            
            // Store the UI value (can be up to 20Hz)
            androidUpdateFrequencies.set(machineId, frequency);
            console.log('Update frequency set for machine:', machineId, 'to', frequency, 'Hz (will be clamped to 19Hz when active)');
            
            // If live mode is currently enabled, restart it with the new frequency (will be clamped to 19Hz)
            if (androidLiveIntervals.has(machineId)) {
                window.toggleAndroidLive(machineId, false);
                window.toggleAndroidLive(machineId, true);
            }
        };

        // Handle Android move button click
        window.moveAndroid = function() {
            if (!selectedMachineId) {
                console.log('No machine selected');
                return;
            }
            const machine = machines.get(selectedMachineId);
            if (!machine || machine.type !== 'android') {
                console.log('Selected machine is not an android:', machine?.type);
                return;
            }

            const xInput = document.getElementById('androidX');
            const yInput = document.getElementById('androidY');
            const zInput = document.getElementById('androidZ');

            if (!xInput || !yInput || !zInput) {
                console.error('Coordinate inputs not found');
                return;
            }

            const x = parseInt(xInput.value);
            const y = parseInt(yInput.value);
            const z = parseInt(zInput.value);

            if (isNaN(x) || isNaN(y) || isNaN(z)) {
                alert('Please enter valid coordinates for X, Y, and Z');
                return;
            }

            console.log('Sending moveTo command:', { x, y, z });
            // Send moveTo command
            window.sendCommandToMachine(selectedMachineId, 'moveTo', {
                x: x,
                y: y,
                z: z
            });
        };

        // Setup Enter key handlers for coordinate inputs
        function setupAndroidInputHandlers() {
            const androidX = document.getElementById('androidX');
            const androidY = document.getElementById('androidY');
            const androidZ = document.getElementById('androidZ');
            const androidUpdateFreq = document.getElementById('androidUpdateFreq');
            
            [androidX, androidY, androidZ].forEach(input => {
                if (input) {
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            window.moveAndroid();
                        }
                    });
                }
            });
            
            // Add listener for update frequency input
            if (androidUpdateFreq) {
                androidUpdateFreq.addEventListener('change', () => {
                    if (selectedMachineId) {
                        window.updateAndroidFrequency(selectedMachineId);
                    }
                });
            }
        }

        // Setup Android input handlers after a short delay to ensure DOM is ready
        setTimeout(() => {
            setupAndroidInputHandlers();
        }, 100);

        // Initialize
        initScene();
        setupMachineListClickHandler(); // Set up event delegation for machine list
        connect();
    </script>
