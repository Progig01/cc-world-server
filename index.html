<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC World Server - Control Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 350px;
            background: #2a2a2a;
            border-right: 2px solid #3a3a3a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px;
            background: #1a1a1a;
            border-bottom: 2px solid #3a3a3a;
        }

        .header h1 {
            font-size: 24px;
            color: #4a9eff;
            margin-bottom: 10px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected {
            background: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        .status-dot.disconnected {
            background: #f44336;
        }

        .machine-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .machine-item {
            background: #333;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .machine-item:hover {
            background: #3a3a3a;
            border-color: #4a9eff;
        }

        .machine-item.selected {
            background: #3a3a3a;
            border-color: #ffff00;
            border-width: 2px;
        }

        .machine-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .machine-name {
            font-weight: bold;
            font-size: 16px;
            color: #4a9eff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .machine-name input {
            flex: 1;
            padding: 4px 8px;
            background: #222;
            border: 1px solid #4a9eff;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
        }

        .edit-icon {
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
            font-size: 14px;
            color: #888;
        }

        .edit-icon:hover {
            opacity: 1;
            color: #4a9eff;
        }

        .edit-icon.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            color: #555;
        }

        .edit-icon.disabled:hover {
            opacity: 0.3;
            color: #555;
        }

        .machine-type {
            padding: 4px 8px;
            background: #555;
            border-radius: 4px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .machine-type.computer {
            background: #2196f3;
        }

        .machine-type.turtle {
            background: #ff9800;
        }

        .machine-type.mining_turtle {
            background: #4caf50;
        }

        .machine-type.chatty_turtle {
            background: #9c27b0;
        }

        .machine-type.android {
            background: #ff5722;
        }

        .machine-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .info-value {
            color: #e0e0e0;
            font-weight: 500;
        }

        .info-value.status-idle {
            color: #4caf50;
        }

        .info-value.status-moving {
            color: #ff9800;
        }

        .info-value.status-busy {
            color: #2196f3;
        }

        .info-value.unknown {
            color: #888;
            font-style: italic;
        }

        .machine-actions {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            background: #444;
            color: #e0e0e0;
        }

        .btn:hover {
            background: #555;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #4a9eff;
            color: white;
        }

        .btn-primary:hover {
            background: #3a8eef;
        }

        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .viewer {
            flex: 1;
            position: relative;
            background: #0a0a0a;
        }

        .viewer-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(26, 26, 26, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
            z-index: 10;
        }

        .viewer-overlay h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #4a9eff;
        }

        .turtle-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(26, 26, 26, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
            z-index: 10;
            display: none;
        }

        .turtle-controls.visible {
            display: block;
        }

        .android-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(26, 26, 26, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
            z-index: 10;
            display: none;
        }

        .android-controls.visible {
            display: block;
        }

        .android-controls .controls-title {
            font-size: 14px;
            color: #4a9eff;
            margin-bottom: 10px;
            text-align: center;
        }

        .android-controls .coordinate-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }

        .android-controls .coordinate-inputs input {
            width: 60px;
            padding: 6px;
            background: #222;
            border: 1px solid #4a9eff;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 13px;
            text-align: center;
        }

        .android-controls .coordinate-inputs input:focus {
            outline: none;
            border-color: #4a9eff;
            box-shadow: 0 0 4px rgba(74, 158, 255, 0.5);
        }

        .android-controls .coordinate-inputs label {
            font-size: 12px;
            color: #888;
            min-width: 15px;
        }

        .android-controls .move-button {
            width: 100%;
            padding: 8px;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .android-controls .move-button:hover {
            background: #3a8eef;
        }

        .android-controls .move-button:active {
            background: #2a7edf;
        }

        .turtle-controls .controls-title {
            font-size: 14px;
            color: #4a9eff;
            margin-bottom: 10px;
            text-align: center;
        }

        .turtle-controls .turtle-coordinate-inputs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }

        .turtle-controls .turtle-coord-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .turtle-controls .turtle-coord-row label {
            font-size: 12px;
            color: #888;
            min-width: 20px;
        }

        .turtle-controls .turtle-coord-row input {
            flex: 1;
            max-width: 80px;
            padding: 6px;
            background: #222;
            border: 1px solid #4a9eff;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 13px;
            text-align: center;
        }

        .turtle-controls .turtle-coord-row input:focus {
            outline: none;
            border-color: #4a9eff;
            box-shadow: 0 0 4px rgba(74, 158, 255, 0.5);
        }

        .turtle-controls .move-button {
            width: 100%;
            padding: 8px;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .turtle-controls .move-button:hover {
            background: #3a8eef;
        }

        .turtle-controls .move-button:active {
            background: #2a7edf;
        }

        .turtle-controls .controls-grid {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        
        .turtle-controls .directional-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 120px;
        }
        
        .turtle-controls .vertical-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
            font-size: 18px;
        }

        /* Scrollbar styling */
        .machine-list::-webkit-scrollbar {
            width: 8px;
        }

        .machine-list::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .machine-list::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        .machine-list::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        .hover-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(26, 26, 26, 0.9);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        .hover-info.visible {
            display: block;
        }

        .hover-info-title {
            color: #4a9eff;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .hover-info-detail {
            color: #aaa;
            font-size: 12px;
        }

        .terminal-panel {
            position: fixed;
            bottom: 0;
            left: 350px;
            right: 0;
            height: 300px;
            background: #1a1a1a;
            border-top: 2px solid #3a3a3a;
            display: none;
            flex-direction: column;
            z-index: 100;
            pointer-events: none;
        }

        .terminal-panel.visible {
            display: flex;
            pointer-events: auto;
        }

        .terminal-header {
            padding: 10px 15px;
            background: #2a2a2a;
            border-bottom: 1px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .terminal-title {
            color: #4a9eff;
            font-weight: bold;
            font-size: 14px;
        }

        .terminal-close {
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 18px;
            padding: 0 5px;
        }

        .terminal-close:hover {
            color: #fff;
        }

        .terminal-content {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #e0e0e0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .terminal-content::-webkit-scrollbar {
            width: 8px;
        }

        .terminal-content::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .terminal-content::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        .terminal-content::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        .terminal-toggle {
            position: absolute;
            bottom: 20px;
            right: 120px;
            background: #4a9eff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            z-index: 50;
        }

        .terminal-toggle:hover {
            background: #3a8eef;
        }
    </style>
</head>
<body>
    <div class="terminal-panel" id="terminalPanel">
        <div class="terminal-header">
            <span class="terminal-title" id="terminalTitle">Terminal Output</span>
            <button class="terminal-close" onclick="window.toggleTerminal()">×</button>
        </div>
        <div class="terminal-content" id="terminalContent"></div>
    </div>
    <div class="sidebar">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <h1 style="margin: 0;">CC World Server</h1>
                <button class="btn-icon" onclick="window.shutdownServer()" title="Shutdown server">⏻</button>
            </div>
            <div class="status-indicator">
                <div class="status-dot disconnected" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
        <div class="machine-list" id="machineList">
            <div class="empty-state">No machines connected</div>
        </div>
    </div>
    <div class="viewer" id="viewer">
        <button class="terminal-toggle" onclick="event.stopPropagation(); window.toggleTerminal(); return false;" title="Toggle Terminal">Terminal</button>
        <div class="turtle-controls" id="turtleControls">
            <div class="controls-title">Turtle Controls</div>
            <div class="controls-grid">
                <div class="directional-controls">
                    <!-- Empty space for grid layout (WASD-style) -->
                    <div></div>
                    <button class="btn" id="btnForward" title="Move forward (↑)">
                        ↑
                    </button>
                    <div></div>
                    <button class="btn" id="btnLeft" title="Turn left (←)">
                        ←
                    </button>
                    <div></div>
                    <button class="btn" id="btnRight" title="Turn right (→)">
                        →
                    </button>
                    <div></div>
                    <button class="btn" id="btnBack" title="Move backward (↓)">
                        ↓
                    </button>
                    <div></div>
                </div>
                <div class="vertical-controls">
                    <button class="btn" id="btnUp" title="Move up (+)">
                        ⬆
                    </button>
                    <button class="btn" id="btnDown" title="Move down (-)">
                        ⬇
                    </button>
                </div>
            </div>
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #3a3a3a;">
                <div class="turtle-coordinate-inputs" style="margin-bottom: 10px;">
                    <div class="turtle-coord-row">
                        <label>X:</label>
                        <input type="number" id="turtleX" placeholder="0" step="1">
                    </div>
                    <div class="turtle-coord-row">
                        <label>Y:</label>
                        <input type="number" id="turtleY" placeholder="0" step="1">
                    </div>
                    <div class="turtle-coord-row">
                        <label>Z:</label>
                        <input type="number" id="turtleZ" placeholder="0" step="1">
                    </div>
                </div>
                <button class="move-button" id="turtleMoveButton" onclick="window.moveTurtle()">Move To</button>
                <div style="font-size: 11px; color: #888; margin-top: 8px; text-align: center;">Uses pathfinding to navigate</div>
            </div>
        </div>
        <div class="android-controls" id="androidControls">
            <div class="controls-title">Android Controls</div>
            <div class="coordinate-inputs">
                <label>X:</label>
                <input type="number" id="androidX" placeholder="0" step="1">
                <label>Y:</label>
                <input type="number" id="androidY" placeholder="0" step="1">
                <label>Z:</label>
                <input type="number" id="androidZ" placeholder="0" step="1">
            </div>
            <button class="move-button" id="androidMoveButton" onclick="window.moveAndroid()">Move</button>
            <div class="live-frequency-controls" style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #3a3a3a;">
                <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px;">
                    <span>Update Frequency (Hz):</span>
                    <input type="number" id="androidUpdateFreq" min="1" max="20" value="8" step="1" style="width: 60px; padding: 4px; background: #222; border: 1px solid #4a9eff; border-radius: 4px; color: #e0e0e0; font-size: 13px; text-align: center;">
                </label>
                <div style="font-size: 11px; color: #888; margin-top: 4px;">Updates per second when live mode is enabled</div>
            </div>
        </div>
        <div class="hover-info" id="hoverInfo">
            <div class="hover-info-title" id="hoverTitle"></div>
            <div class="hover-info-detail" id="hoverDetail"></div>
        </div>
    </div>

    <script>
        const WS_URL = 'ws://localhost:8080';
        let ws = null;
        let machines = new Map();
        let entities = new Map();
        let scene, camera, renderer;
        let machineMeshes = new Map();
        let chunks = new Map(); // "dimension,x,z" -> chunk data
        let chunkMeshes = new Map(); // "dimension,x,z" -> THREE.Group
        let blockTextures = new Map(); // block name -> THREE.Texture
        let pathfindingLines = new Map(); // machineId -> THREE.Line for path visualization
        
        // Update pathfinding visualization for a turtle
        function updatePathfindingVisualization(machineId, path) {
            clearPathfindingVisualization(machineId); // Clear existing line

            if (!path || path.length < 2) {
                return;
            }

            const points = [];
            path.forEach(p => {
                // Center the line in the block
                points.push(new THREE.Vector3(p.x + 0.5, p.y + 0.5, p.z + 0.5));
            });

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ 
                color: 0xff0000, // Red color
                linewidth: 2,    // Thickness of the line
                transparent: true,
                opacity: 0.8
            });
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            pathfindingLines.set(machineId, line);
        }
        
        // Clear pathfinding visualization for a turtle
        function clearPathfindingVisualization(machineId) {
            const line = pathfindingLines.get(machineId);
            if (line) {
                scene.remove(line);
                line.geometry.dispose();
                line.material.dispose();
                pathfindingLines.delete(machineId);
            }
        }
        
        // Camera controls
        let isRightMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let rightClickStartX = 0, rightClickStartY = 0; // Track right-click start position
        let cameraRotation = { x: 0, y: 0 };
        let cameraPosition = { x: 0, y: 50, z: 100 };
        
        // Load camera state from localStorage
        function loadCameraState() {
            try {
                const saved = localStorage.getItem('cameraState');
                if (saved) {
                    const state = JSON.parse(saved);
                    if (state.position) {
                        cameraPosition = state.position;
                    }
                    if (state.rotation) {
                        cameraRotation = state.rotation;
                    }
                }
            } catch (e) {
                console.warn('Failed to load camera state:', e);
            }
        }
        
        // Save camera state to localStorage
        function saveCameraState() {
            try {
                localStorage.setItem('cameraState', JSON.stringify({
                    position: { ...cameraPosition },
                    rotation: { ...cameraRotation }
                }));
            } catch (e) {
                console.warn('Failed to save camera state:', e);
            }
        }
        
        // Load camera state on initialization
        loadCameraState();
        const moveSpeed = 0.5;
        const rotationSpeed = 0.002; // Reduced for smoother feel
        const keys = {};
        let selectedMachineId = null;
        let selectionMesh = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        const terminalOutput = new Map(); // machineId -> string (accumulated terminal output)
        let terminalPanelVisible = false;
        let hoveredObject = null;
        let androidLiveIntervals = new Map(); // machineId -> intervalId
        let androidUpdateFrequencies = new Map(); // machineId -> frequency (Hz)
        // AAA-quality position buffer system (handles variable update rates 8-20Hz)
        let machinePositionHistory = new Map(); // machineId -> {
        //   buffer: Array<{pos, time}>, // Circular buffer of recent positions (up to 4 samples)
        //   updateRate: number, // Measured update rate (Hz)
        //   adaptiveLag: number, // Adaptive lag compensation (ms)
        //   velocity: {x, y, z}, // Current velocity
        //   lastRenderedPos: {x, y, z} // Last rendered position for smoothing
        // }
        
        const MAX_BUFFER_SIZE = 4; // Keep up to 4 position samples for spline interpolation
        const MIN_BUFFER_SIZE = 2; // Need at least 2 for interpolation
        const BASE_LAG_MS = 100; // Base lag compensation
        const MAX_LAG_MS = 200; // Maximum lag compensation
        const MIN_UPDATE_RATE = 8; // Minimum expected update rate (Hz)
        const MAX_UPDATE_RATE = 20; // Maximum expected update rate (Hz)
        
        // Catmull-Rom spline interpolation (AAA game quality)
        function catmullRomSpline(p0, p1, p2, p3, t) {
            // Catmull-Rom spline: smooth curve through p1 and p2, using p0 and p3 as control points
            const t2 = t * t;
            const t3 = t2 * t;
            
            return {
                x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
                y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
                z: 0.5 * ((2 * p1.z) + (-p0.z + p2.z) * t + (2 * p0.z - 5 * p1.z + 4 * p2.z - p3.z) * t2 + (-p0.z + 3 * p1.z - 3 * p2.z + p3.z) * t3)
            };
        }
        
        // Position interpolation function (AAA-quality buffer-based system)
        function interpolatePosition(machineId, targetPosition, timestamp) {
            if (!machinePositionHistory.has(machineId)) {
                // Initialize with first position
                machinePositionHistory.set(machineId, {
                    buffer: [{ pos: { ...targetPosition }, time: timestamp }],
                    updateRate: 10, // Initial estimate
                    adaptiveLag: BASE_LAG_MS,
                    velocity: { x: 0, y: 0, z: 0 },
                    lastRenderedPos: { ...targetPosition }
                });
                return;
            }
            
            const history = machinePositionHistory.get(machineId);
            
            // Add new position to buffer
            history.buffer.push({ pos: { ...targetPosition }, time: timestamp });
            
            // Keep buffer size manageable (remove oldest entries)
            if (history.buffer.length > MAX_BUFFER_SIZE) {
                history.buffer.shift();
            }
            
            // Calculate update rate from buffer
            if (history.buffer.length >= 2) {
                const timeSpan = history.buffer[history.buffer.length - 1].time - history.buffer[0].time;
                const sampleCount = history.buffer.length - 1;
                if (timeSpan > 0) {
                    const measuredRate = (sampleCount / timeSpan) * 1000; // Convert to Hz
                    // Exponential moving average for update rate (smooth out variations)
                    history.updateRate = history.updateRate * 0.7 + measuredRate * 0.3;
                    
                    // Adapt lag compensation based on update rate
                    // Lower update rate = more lag needed for smooth interpolation
                    const rateRatio = Math.max(0, Math.min(1, (history.updateRate - MIN_UPDATE_RATE) / (MAX_UPDATE_RATE - MIN_UPDATE_RATE)));
                    history.adaptiveLag = BASE_LAG_MS + (MAX_LAG_MS - BASE_LAG_MS) * (1 - rateRatio);
                }
            }
            
            // Calculate velocity from most recent position change
            if (history.buffer.length >= 2) {
                const latest = history.buffer[history.buffer.length - 1];
                const previous = history.buffer[history.buffer.length - 2];
                const dt = (latest.time - previous.time) / 1000; // Convert to seconds
                
                if (dt > 0 && dt < 2) { // Reasonable time difference
                    history.velocity = {
                        x: (latest.pos.x - previous.pos.x) / dt,
                        y: (latest.pos.y - previous.pos.y) / dt,
                        z: (latest.pos.z - previous.pos.z) / dt
                    };
                }
            }
        }
        
        // Get interpolated/extrapolated position for rendering (AAA-quality spline interpolation)
        function getInterpolatedPosition(machineId, currentTime) {
            const history = machinePositionHistory.get(machineId);
            if (!history || !history.buffer || history.buffer.length === 0) return null;
            
            // Apply adaptive lag compensation (adjusts based on actual update rate)
            const renderTime = currentTime - history.adaptiveLag;
            
            const buffer = history.buffer;
            const latest = buffer[buffer.length - 1];
            
            // If we only have one sample, use it directly
            if (buffer.length === 1) {
                return latest.pos;
            }
            
            // Find the two samples to interpolate between
            let p0, p1, p2, p3;
            let t = 0;
            
            // Find the segment we're in
            for (let i = 0; i < buffer.length - 1; i++) {
                const sample0 = buffer[i];
                const sample1 = buffer[i + 1];
                
                if (renderTime >= sample0.time && renderTime <= sample1.time) {
                    // We're between these two samples
                    const timeDiff = sample1.time - sample0.time;
                    if (timeDiff > 0) {
                        t = (renderTime - sample0.time) / timeDiff;
                        
                        // Get control points for Catmull-Rom spline
                        if (i === 0) {
                            // First segment: duplicate first point
                            p0 = sample0.pos;
                            p1 = sample0.pos;
                            p2 = sample1.pos;
                            p3 = buffer.length > 2 ? buffer[i + 2].pos : sample1.pos;
                        } else if (i === buffer.length - 2) {
                            // Last segment: duplicate last point
                            p0 = buffer[i - 1].pos;
                            p1 = sample0.pos;
                            p2 = sample1.pos;
                            p3 = sample1.pos;
                        } else {
                            // Middle segment: use all 4 points
                            p0 = buffer[i - 1].pos;
                            p1 = sample0.pos;
                            p2 = sample1.pos;
                            p3 = buffer[i + 2].pos;
                        }
                        
                        // Use Catmull-Rom spline for smooth interpolation
                        const splinePos = catmullRomSpline(p0, p1, p2, p3, t);
                        
                        // Apply light exponential smoothing to reduce micro-jitter (AAA technique)
                        const smoothingFactor = 0.15; // Light smoothing (85% new, 15% old)
                        history.lastRenderedPos = {
                            x: history.lastRenderedPos.x * (1 - smoothingFactor) + splinePos.x * smoothingFactor,
                            y: history.lastRenderedPos.y * (1 - smoothingFactor) + splinePos.y * smoothingFactor,
                            z: history.lastRenderedPos.z * (1 - smoothingFactor) + splinePos.z * smoothingFactor
                        };
                        
                        return history.lastRenderedPos;
                    }
                }
            }
            
            // If we're beyond the latest sample, extrapolate using velocity
            if (renderTime > latest.time) {
                const extrapolationTime = (renderTime - latest.time) / 1000; // Convert to seconds
                const maxExtrapolation = history.adaptiveLag / 1000; // Limit to adaptive lag time
                
                if (extrapolationTime <= maxExtrapolation && history.velocity) {
                    const extrapolatedPos = {
                        x: latest.pos.x + history.velocity.x * extrapolationTime,
                        y: latest.pos.y + history.velocity.y * extrapolationTime,
                        z: latest.pos.z + history.velocity.z * extrapolationTime
                    };
                    
                    // Apply smoothing to extrapolated position
                    const smoothingFactor = 0.15;
                    history.lastRenderedPos = {
                        x: history.lastRenderedPos.x * (1 - smoothingFactor) + extrapolatedPos.x * smoothingFactor,
                        y: history.lastRenderedPos.y * (1 - smoothingFactor) + extrapolatedPos.y * smoothingFactor,
                        z: history.lastRenderedPos.z * (1 - smoothingFactor) + extrapolatedPos.z * smoothingFactor
                    };
                    
                    return history.lastRenderedPos;
                }
            }
            
            // Fall back to latest position
            return latest.pos;
        }
        
        // Initialize Three.js scene
        function initScene() {
            const container = document.getElementById('viewer');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Default to light sky blue
            
            camera = new THREE.PerspectiveCamera(
                75,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(cameraPosition.x, cameraPosition.y, cameraPosition.z);
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            
            // Add lighting - 2pm sunlight (top-down with slight angle)
            // Ambient light for overall illumination
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            // Main directional light - positioned like 2pm sun (mostly overhead, slight angle)
            // Sun position: high up (Y=100), slightly to the south-west (X=-30, Z=-30)
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
            directionalLight.position.set(-30, 100, -30);
            directionalLight.castShadow = false;
            scene.add(directionalLight);
            
            // Secondary fill light from opposite angle for better illumination
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.2);
            fillLight.position.set(30, 50, 30);
            scene.add(fillLight);
            
            
            // Mouse controls
            container.addEventListener('contextmenu', (e) => e.preventDefault());
            container.addEventListener('mousedown', (e) => {
                if (e.button === 2) { // Right mouse button
                    isRightMouseDown = true;
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                    rightClickStartX = e.clientX; // Store start position
                    rightClickStartY = e.clientY;
                } else if (e.button === 0) { // Left mouse button - click to select
                    handleClick(e);
                }
            });
            container.addEventListener('mouseup', (e) => {
                if (e.button === 2) {
                    isRightMouseDown = false;
                    // Only handle right-click if it was a click (not a drag)
                    // Check if mouse moved less than 5 pixels (indicates a click, not drag)
                    const dragThreshold = 5;
                    const dragDistance = Math.sqrt(
                        Math.pow(e.clientX - rightClickStartX, 2) + 
                        Math.pow(e.clientY - rightClickStartY, 2)
                    );
                    if (dragDistance < dragThreshold) {
                        handleRightClick(e);
                    }
                }
            });
            container.addEventListener('mousemove', (e) => {
                if (isRightMouseDown) {
                    const deltaX = e.clientX - mouseX;
                    const deltaY = e.clientY - mouseY;
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                    
                    // Invert Y for more natural camera feel
                    cameraRotation.y += deltaX * rotationSpeed;
                    cameraRotation.x += deltaY * rotationSpeed;
                    cameraRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraRotation.x));
                    
                    // Save camera state after rotation (throttled)
                    if (!window.cameraSaveTimeout) {
                        window.cameraSaveTimeout = setTimeout(() => {
                            saveCameraState();
                            window.cameraSaveTimeout = null;
                        }, 500);
                    }
                } else {
                    // Handle hover
                    handleHover(e);
                }
            });
            
            // Keyboard controls (WASD when right-clicking for camera, arrow keys for turtle movement)
            window.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
                
                // Turtle movement controls (only when a turtle is selected and not right-clicking)
                if (selectedMachineId && !isRightMouseDown) {
                    const machine = machines.get(selectedMachineId);
                    const isTurtle = machine && machine.type && (machine.type === 'turtle' || machine.type.endsWith('_turtle'));
                    
                    if (isTurtle) {
                        if (e.key === 'ArrowUp') {
                            e.preventDefault();
                            window.sendMoveThenUpdate(selectedMachineId, 'move', {direction: 'forward'});
                        } else if (e.key === 'ArrowDown') {
                            e.preventDefault();
                            window.sendMoveThenUpdate(selectedMachineId, 'move', {direction: 'back'});
                        } else if (e.key === 'ArrowLeft') {
                            e.preventDefault();
                            window.sendMoveThenUpdate(selectedMachineId, 'turn', {direction: 'left'});
                        } else if (e.key === 'ArrowRight') {
                            e.preventDefault();
                            window.sendMoveThenUpdate(selectedMachineId, 'turn', {direction: 'right'});
                        } else if (e.key === '+' || e.key === '=') {
                            e.preventDefault();
                            window.sendMoveThenUpdate(selectedMachineId, 'move', {direction: 'up'});
                        } else if (e.key === '-' || e.key === '_') {
                            e.preventDefault();
                            window.sendMoveThenUpdate(selectedMachineId, 'move', {direction: 'down'});
                        }
                    }
                }
            });
            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });
            
            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
            
            // Update camera based on controls
            function updateCamera() {
                if (isRightMouseDown) {
                    // Calculate forward, right, and up vectors based on rotation
                    const forward = new THREE.Vector3(
                        Math.sin(cameraRotation.y) * Math.cos(cameraRotation.x),
                        -Math.sin(cameraRotation.x),
                        -Math.cos(cameraRotation.y) * Math.cos(cameraRotation.x)
                    );
                    const right = new THREE.Vector3(
                        Math.sin(cameraRotation.y - Math.PI / 2),
                        0,
                        -Math.cos(cameraRotation.y - Math.PI / 2)
                    );
                    
                    // Apply movement
                    if (keys['w']) {
                        cameraPosition.x += forward.x * moveSpeed;
                        cameraPosition.y += forward.y * moveSpeed;
                        cameraPosition.z += forward.z * moveSpeed;
                    }
                    if (keys['s']) {
                        cameraPosition.x -= forward.x * moveSpeed;
                        cameraPosition.y -= forward.y * moveSpeed;
                        cameraPosition.z -= forward.z * moveSpeed;
                    }
                    // Reversed A/D for correct strafing
                    if (keys['a']) {
                        cameraPosition.x += right.x * moveSpeed;
                        cameraPosition.z += right.z * moveSpeed;
                    }
                    if (keys['d']) {
                        cameraPosition.x -= right.x * moveSpeed;
                        cameraPosition.z -= right.z * moveSpeed;
                    }
                    if (keys[' ']) { // Space
                        cameraPosition.y += moveSpeed;
                    }
                    if (keys['shift']) {
                        cameraPosition.y -= moveSpeed;
                    }
                }
                
                // Update camera position and rotation
                camera.position.set(cameraPosition.x, cameraPosition.y, cameraPosition.z);
                const lookAtX = cameraPosition.x + Math.sin(cameraRotation.y) * Math.cos(cameraRotation.x);
                const lookAtY = cameraPosition.y - Math.sin(cameraRotation.x);
                const lookAtZ = cameraPosition.z - Math.cos(cameraRotation.y) * Math.cos(cameraRotation.x);
                camera.lookAt(lookAtX, lookAtY, lookAtZ);
                
                // Save camera state periodically (throttled to avoid excessive writes)
                if (!window.cameraSaveTimeout) {
                    window.cameraSaveTimeout = setTimeout(() => {
                        saveCameraState();
                        window.cameraSaveTimeout = null;
                    }, 500); // Save every 500ms max
                }
                
                // Update selection indicator position to follow selected machine
                if (selectionMesh && selectedMachineId) {
                    const machineGroup = machineMeshes.get(selectedMachineId);
                    const machine = machines.get(selectedMachineId);
                    if (machineGroup && machine) {
                        let cubeCenter;
                        if (machine.type === 'android') {
                            // Android: mesh is at (0.3, 0.9, 0.3) in group space, group position is at (x, y-1, z)
                            // So cube center in world space is (x+0.3, (y-1)+0.9, z+0.3) = (x+0.3, y-0.1, z+0.3)
                            // But we want visual center at (x+0.3, y+0.9, z+0.3) since feet should be at y
                            cubeCenter = machineGroup.position.clone().add(new THREE.Vector3(0.3, 0.9, 0.3));
                        } else {
                            cubeCenter = machineGroup.position.clone().add(new THREE.Vector3(0.5, 0.5, 0.5));
                        }
                        selectionMesh.position.copy(cubeCenter);
                    }
                }
            }
            
            // Handle hover detection
            function handleHover(event) {
                const rect = container.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                
                // Collect all intersectable objects (machines and blocks)
                const intersectableObjects = [];
                
                // Add machine meshes
                machineMeshes.forEach((meshGroup, id) => {
                    meshGroup.children.forEach(child => {
                        if (child instanceof THREE.Mesh) {
                            child.userData = { type: 'machine', machineId: id };
                            intersectableObjects.push(child);
                        }
                    });
                });
                
                // Add chunk meshes (chunkMeshes are now Groups containing multiple Meshes)
                chunkMeshes.forEach((chunkGroup) => {
                    if (chunkGroup instanceof THREE.Group) {
                        // Add all child meshes from the group
                        chunkGroup.children.forEach(child => {
                            if (child instanceof THREE.Mesh) {
                                // Preserve block name from userData if it exists
                                if (!child.userData.type) {
                                    child.userData.type = 'block';
                                }
                                intersectableObjects.push(child);
                            }
                        });
                    }
                });
                
                const intersects = raycaster.intersectObjects(intersectableObjects);
                
                const hoverInfo = document.getElementById('hoverInfo');
                const hoverTitle = document.getElementById('hoverTitle');
                const hoverDetail = document.getElementById('hoverDetail');
                
                if (intersects.length > 0) {
                    const intersect = intersects[0];
                    const userData = intersect.object.userData;
                    
                    if (userData.type === 'machine') {
                        const machine = machines.get(userData.machineId);
                        const entity = entities.get(userData.machineId);
                        const position = entity?.position || machine?.status?.position;
                        const label = machine?.status?.label || '';
                        
                        // Use label if available, otherwise fallback to type + ID
                        const displayName = label || `${machine?.type?.replace('_', ' ') || 'Machine'} #${userData.machineId}`;
                        hoverTitle.textContent = displayName;
                        if (position && typeof position === 'object') {
                            hoverDetail.textContent = `Position: ${position.x}, ${position.y}, ${position.z}`;
                        } else {
                            hoverDetail.textContent = 'Position: Unknown';
                        }
                        hoverInfo.classList.add('visible');
                        hoveredObject = intersect.object;
                    } else if (userData.type === 'block') {
                        // Calculate block position from intersection point
                        const point = intersect.point;
                        // Move slightly back along the normal to ensure we get the correct block
                        // Use a larger offset to ensure we're inside the block, not on the face
                        const normal = intersect.face.normal.clone();
                        const adjustedPoint = point.clone().add(normal.multiplyScalar(-0.1));
                        const blockX = Math.floor(adjustedPoint.x);
                        const blockY = Math.floor(adjustedPoint.y);
                        const blockZ = Math.floor(adjustedPoint.z);
                        
                        // Look up block name from chunk data
                        // Try exact match first, then search nearby positions (within 1 block) if not found
                        let blockName = 'unknown';
                        let foundBlock = null;
                        if (userData.chunkData && userData.chunkData.data) {
                            // First try exact match
                            foundBlock = userData.chunkData.data.find(block => 
                                block.x === blockX && block.y === blockY && block.z === blockZ
                            );
                            
                            // If not found, search nearby (within 1 block in each direction)
                            if (!foundBlock) {
                                for (let dx = -1; dx <= 1 && !foundBlock; dx++) {
                                    for (let dy = -1; dy <= 1 && !foundBlock; dy++) {
                                        for (let dz = -1; dz <= 1 && !foundBlock; dz++) {
                                            foundBlock = userData.chunkData.data.find(block => 
                                                block.x === blockX + dx && 
                                                block.y === blockY + dy && 
                                                block.z === blockZ + dz
                                            );
                                        }
                                    }
                                }
                            }
                            
                            if (foundBlock && foundBlock.name) {
                                blockName = foundBlock.name;
                                // Format: "minecraft:stone" -> "Stone" or keep as-is if format is unexpected
                                if (blockName.includes(':')) {
                                    const parts = blockName.split(':');
                                    const namePart = parts[parts.length - 1];
                                    // Capitalize first letter of each word
                                    blockName = namePart.split('_').map(word => 
                                        word.charAt(0).toUpperCase() + word.slice(1)
                                    ).join(' ');
                                }
                                // Use the actual block coordinates from the found block
                                const actualX = foundBlock.x;
                                const actualY = foundBlock.y;
                                const actualZ = foundBlock.z;
                                hoverTitle.textContent = blockName;
                                
                                // Format timestamp for display
                                let timestampText = '';
                                if (foundBlock.updatedAt) {
                                    const date = new Date(foundBlock.updatedAt);
                                    const now = Date.now();
                                    const diffMs = now - foundBlock.updatedAt;
                                    const diffSec = Math.floor(diffMs / 1000);
                                    const diffMin = Math.floor(diffSec / 60);
                                    const diffHour = Math.floor(diffMin / 60);
                                    const diffDay = Math.floor(diffHour / 24);
                                    
                                    if (diffDay > 0) {
                                        timestampText = `Scanned ${diffDay} day${diffDay > 1 ? 's' : ''} ago`;
                                    } else if (diffHour > 0) {
                                        timestampText = `Scanned ${diffHour} hour${diffHour > 1 ? 's' : ''} ago`;
                                    } else if (diffMin > 0) {
                                        timestampText = `Scanned ${diffMin} minute${diffMin > 1 ? 's' : ''} ago`;
                                    } else {
                                        timestampText = `Scanned ${diffSec} second${diffSec !== 1 ? 's' : ''} ago`;
                                    }
                                    timestampText += ` (${date.toLocaleString()})`;
                                }
                                
                                hoverDetail.textContent = `Position: ${actualX}, ${actualY}, ${actualZ}${timestampText ? '\n' + timestampText : ''}`;
                            } else {
                                hoverTitle.textContent = 'Block';
                                hoverDetail.textContent = `Position: ${blockX}, ${blockY}, ${blockZ}`;
                            }
                        } else {
                            hoverTitle.textContent = 'Block';
                            hoverDetail.textContent = `Position: ${blockX}, ${blockY}, ${blockZ}`;
                        }
                        hoverInfo.classList.add('visible');
                        hoveredObject = intersect.object;
                    }
                } else {
                    hoverInfo.classList.remove('visible');
                    hoveredObject = null;
                }
            }
            
            // Handle click to select machine
            function handleClick(event) {
                const rect = container.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                
                // Only check machine meshes for clicking
                const machineObjects = [];
                machineMeshes.forEach((meshGroup, id) => {
                    meshGroup.children.forEach(child => {
                        if (child instanceof THREE.Mesh) {
                            child.userData = { type: 'machine', machineId: id };
                            machineObjects.push(child);
                        }
                    });
                });
                
                const intersects = raycaster.intersectObjects(machineObjects);
                
                if (intersects.length > 0) {
                    const intersect = intersects[0];
                    const userData = intersect.object.userData;
                    if (userData.type === 'machine') {
                        selectMachine(userData.machineId);
                    }
                }
            }

            // Handle right-click to move android or turtle
            function handleRightClick(event) {
                if (!selectedMachineId) return;
                const machine = machines.get(selectedMachineId);
                if (!machine) return;
                
                const isAndroid = machine.type === 'android';
                const isTurtle = machine.type === 'turtle' || machine.type.endsWith('_turtle');
                
                if (!isAndroid && !isTurtle) return;

                const rect = container.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                
                // Collect all block meshes for intersection
                const blockObjects = [];
                chunkMeshes.forEach((chunkGroup) => {
                    if (chunkGroup instanceof THREE.Group) {
                        chunkGroup.children.forEach(child => {
                            if (child instanceof THREE.Mesh) {
                                blockObjects.push(child);
                            }
                        });
                    }
                });
                
                const intersects = raycaster.intersectObjects(blockObjects);
                
                if (intersects.length > 0) {
                    const intersect = intersects[0];
                    const point = intersect.point;
                    // Move slightly along the normal to get the block center
                    const normal = intersect.face.normal.clone();
                    const adjustedPoint = point.clone().add(normal.multiplyScalar(0.1));
                    
                    // Get block coordinates (floor to get integer coordinates)
                    const targetX = Math.floor(adjustedPoint.x);
                    const targetY = Math.floor(adjustedPoint.y);
                    const targetZ = Math.floor(adjustedPoint.z);
                    
                    // For androids and turtles: move to block ABOVE the clicked block (y+1)
                    // This ensures the machine stands on top of the block, not inside it
                    const moveY = targetY + 1;
                    
                    // Send moveTo command
                    window.sendCommandToMachine(selectedMachineId, 'moveTo', {
                        x: targetX,
                        y: moveY,
                        z: targetZ
                    });
                }
            }
            
            // Start render loop
            function animate() {
                requestAnimationFrame(animate);
                updateMachineMeshPositions(); // Update positions with interpolation
                updateCamera();
                renderer.render(scene, camera);
            }
            animate();
        }
        
        // Request chunk data from server
        function requestChunk(dimension, x, z) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            const chunkKey = `${dimension},${x},${z}`;
            console.log('Requesting chunk:', chunkKey);
            ws.send(JSON.stringify({
                type: 'chunk_request',
                dimension: dimension,
                center: { x: x, z: z },
                radius: 0
            }));
        }
        
        // Request chunks in radius (for loading all stored chunks)
        function requestChunksInRadius(dimension, centerX, centerZ, radius) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            console.log('Requesting chunks in radius:', dimension, centerX, centerZ, radius);
            ws.send(JSON.stringify({
                type: 'chunk_request',
                dimension: dimension,
                center: { x: centerX, z: centerZ },
                radius: radius
            }));
        }

        // Load block texture from server (textures are stored in textures/ folder)
        // If texture file doesn't exist, server will generate a blank one
        function getBlockTexture(blockName) {
            if (!blockName) blockName = 'unknown';
            
            if (!blockTextures.has(blockName)) {
                // Sanitize block name for filename (replace : with _ and / with _)
                const textureFileName = blockName.replace(/:/g, '_').replace(/\//g, '_') + '.png';
                const textureUrl = `http://localhost:8081/textures/${textureFileName}`;
                
                // Create texture loader
                const loader = new THREE.TextureLoader();
                const texture = loader.load(
                    textureUrl,
                    // onLoad callback
                    () => {
                        texture.magFilter = THREE.NearestFilter;
                        texture.minFilter = THREE.NearestFilter;
                        texture.name = blockName;
                    },
                    // onProgress callback (optional)
                    undefined,
                    // onError callback - fallback to canvas-generated texture
                    () => {
                        console.warn('Failed to load texture for', blockName, '- using fallback');
                        // Create fallback texture from canvas
                        const canvas = document.createElement('canvas');
                        canvas.width = 16;
                        canvas.height = 16;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#888888';
                        ctx.fillRect(0, 0, 16, 16);
                        ctx.strokeStyle = '#666666';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(0.5, 0.5, 15, 15);
                        const fallbackTexture = new THREE.CanvasTexture(canvas);
                        fallbackTexture.magFilter = THREE.NearestFilter;
                        fallbackTexture.minFilter = THREE.NearestFilter;
                        fallbackTexture.name = blockName;
                        blockTextures.set(blockName, fallbackTexture);
                    }
                );
                
                texture.magFilter = THREE.NearestFilter;
                texture.minFilter = THREE.NearestFilter;
                texture.name = blockName;
                blockTextures.set(blockName, texture);
            }
            return blockTextures.get(blockName);
        }

        // Helper function to check if a block is a machine block (turtle, computer, etc.)
        function isMachineBlock(blockName) {
            if (!blockName || typeof blockName !== 'string') {
                return false;
            }
            const name = blockName.toLowerCase();
            // Filter out ComputerCraft blocks (turtles, computers, monitors, etc.)
            if (name.includes('computercraft:') || name.includes('cctweaked:') || name.includes('cc_androids:')) {
                return true;
            }
            return false;
        }
        
        // Helper function to check if a block position matches a machine position
        function isMachinePosition(x, y, z) {
            // Check if any machine is at this position (using integer coordinates)
            for (const machine of machines.values()) {
                const pos = machine.position || machine.status?.position;
                if (pos && typeof pos === 'object' && pos !== 'unknown') {
                    const mx = Math.floor(pos.x);
                    const my = Math.floor(pos.y);
                    const mz = Math.floor(pos.z);
                    if (mx === x && my === y && mz === z) {
                        return true;
                    }
                }
            }
            return false;
        }

        // Greedy meshing algorithm - merges adjacent faces of the same block type
        function greedyMesh(chunkData, chunkX, chunkZ) {
            const blocks = chunkData.data || [];
            console.log('greedyMesh called with blocks:', blocks.length, 'chunkData:', chunkData);
            // Return null only if data doesn't exist or isn't an array, but allow empty arrays (will just return null geometry which is fine)
            if (!Array.isArray(blocks)) {
                console.log('chunkData.data is not an array');
                return null;
            }
            
            // Filter out machine blocks and blocks at machine positions
            const filteredBlocks = blocks.filter(block => {
                if (!block || block.x === undefined || block.y === undefined || block.z === undefined) {
                    return false;
                }
                // Filter out machine blocks by name
                if (isMachineBlock(block.name)) {
                    return false;
                }
                // Filter out blocks at machine positions
                if (isMachinePosition(block.x, block.y, block.z)) {
                    return false;
                }
                return true;
            });
            
            if (filteredBlocks.length === 0) {
                console.log('No blocks in chunk data after filtering (empty array)');
                return null;
            }
            
            // Build a block map: "x,y,z" -> block name
            const blockMap = new Map();
            filteredBlocks.forEach(block => {
                if (block.x !== undefined && block.y !== undefined && block.z !== undefined) {
                    const key = `${block.x},${block.y},${block.z}`;
                    blockMap.set(key, block.name || 'unknown');
                }
            });
            
            // Helper to check if block exists at position
            const hasBlock = (x, y, z) => blockMap.has(`${x},${y},${z}`);
            
            // Get visible faces (faces with no adjacent block)
            const visibleFaces = [];
            filteredBlocks.forEach(block => {
                const { x, y, z, name } = block;
                
                const directions = [
                    { dir: 'up', dx: 0, dy: 1, dz: 0 },
                    { dir: 'down', dx: 0, dy: -1, dz: 0 },
                    { dir: 'north', dx: 0, dy: 0, dz: -1 },
                    { dir: 'south', dx: 0, dy: 0, dz: 1 },
                    { dir: 'east', dx: 1, dy: 0, dz: 0 },
                    { dir: 'west', dx: -1, dy: 0, dz: 0 }
                ];
                
                directions.forEach(({ dir, dx, dy, dz }) => {
                    if (!hasBlock(x + dx, y + dy, z + dz)) {
                        visibleFaces.push({ x, y, z, name, direction: dir });
                    }
                });
            });
            
            // Group faces by block type and direction for greedy meshing
            // Use '|' as separator since block names contain ':'
            const faceGroups = new Map();
            visibleFaces.forEach(face => {
                const key = `${face.name}|${face.direction}`;
                if (!faceGroups.has(key)) {
                    faceGroups.set(key, []);
                }
                faceGroups.get(key).push(face);
            });
            
            // Group by block type (for per-block textures)
            const blockTypeGroups = new Map();
            faceGroups.forEach((faces, groupKey) => {
                const lastPipeIndex = groupKey.lastIndexOf('|');
                const blockName = groupKey.substring(0, lastPipeIndex);
                const direction = groupKey.substring(lastPipeIndex + 1);
                
                if (!blockTypeGroups.has(blockName)) {
                    blockTypeGroups.set(blockName, []);
                }
                blockTypeGroups.get(blockName).push({ faces, direction });
            });
            
            // Create geometry for each block type
            const geometries = [];
            blockTypeGroups.forEach((directionGroups, blockName) => {
                const positions = [];
                const normals = [];
                const uvs = [];
                const indices = [];
                let vertexOffset = 0;
                
                directionGroups.forEach(({ faces, direction }) => {
                    // Simple greedy meshing: create quads for each face (can be optimized to merge adjacent quads)
                    faces.forEach(face => {
                        const { x, y, z } = face;
                        let v0, v1, v2, v3, normal;
                        
                        switch (direction) {
                            case 'up':
                                v0 = [x, y + 1, z]; v1 = [x + 1, y + 1, z];
                                v2 = [x + 1, y + 1, z + 1]; v3 = [x, y + 1, z + 1];
                                normal = [0, 1, 0];
                                break;
                            case 'down':
                                v0 = [x, y, z + 1]; v1 = [x + 1, y, z + 1];
                                v2 = [x + 1, y, z]; v3 = [x, y, z];
                                normal = [0, -1, 0];
                                break;
                            case 'north':
                                v0 = [x, y, z]; v1 = [x, y + 1, z];
                                v2 = [x + 1, y + 1, z]; v3 = [x + 1, y, z];
                                normal = [0, 0, -1];
                                break;
                            case 'south':
                                v0 = [x + 1, y, z + 1]; v1 = [x + 1, y + 1, z + 1];
                                v2 = [x, y + 1, z + 1]; v3 = [x, y, z + 1];
                                normal = [0, 0, 1];
                                break;
                            case 'east':
                                v0 = [x + 1, y, z + 1]; v1 = [x + 1, y + 1, z + 1];
                                v2 = [x + 1, y + 1, z]; v3 = [x + 1, y, z];
                                normal = [1, 0, 0];
                                break;
                            case 'west':
                                v0 = [x, y, z]; v1 = [x, y + 1, z];
                                v2 = [x, y + 1, z + 1]; v3 = [x, y, z + 1];
                                normal = [-1, 0, 0];
                                break;
                        }
                        
                        // Add vertices
                        positions.push(...v0, ...v1, ...v2, ...v3);
                        normals.push(...normal, ...normal, ...normal, ...normal);
                        uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
                        
                        // Add indices for two triangles (counter-clockwise winding for front faces)
                        // Ensure proper winding order: when viewed from outside, vertices should be counter-clockwise
                        indices.push(
                            vertexOffset, vertexOffset + 1, vertexOffset + 2,
                            vertexOffset, vertexOffset + 2, vertexOffset + 3
                        );
                        
                        vertexOffset += 4;
                    });
                });
                
                if (positions.length > 0) {
                    // Create geometry for this block type
                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                    geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
                    geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                    geometry.setIndex(indices);
                    geometries.push({ geometry, blockName });
                }
            });
            
            if (geometries.length === 0) {
                console.log('No geometries generated in greedyMesh');
                return null;
            }
            
            return geometries;
        }

        // Update chunk mesh
        function updateChunkMesh(chunk) {
            const chunkKey = `${chunk.dimension || 'overworld'},${chunk.x},${chunk.z}`;
            console.log('updateChunkMesh called for:', chunkKey);
            
            // Remove old mesh/group if it exists
            if (chunkMeshes.has(chunkKey)) {
                const oldGroup = chunkMeshes.get(chunkKey);
                // Dispose of all meshes in the group
                oldGroup.traverse((child) => {
                    if (child instanceof THREE.Mesh) {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (child.material.map) child.material.map.dispose();
                            child.material.dispose();
                        }
                    }
                });
                scene.remove(oldGroup);
                chunkMeshes.delete(chunkKey);
            }
            
            // Create new mesh using greedy meshing (returns array of {geometry, blockName} per block type)
            const geometries = greedyMesh(chunk, chunk.x, chunk.z);
            if (!geometries || geometries.length === 0) {
                console.log('greedyMesh returned null/empty for chunk:', chunkKey, '- chunk has', chunk.data?.length || 0, 'blocks');
                // Don't return early - chunks with no blocks are valid, we just don't render them
                return;
            }
            
            // Create a group to hold all meshes for this chunk
            const chunkGroup = new THREE.Group();
            
            // Create a separate mesh for each block type with its own texture
            geometries.forEach(({ geometry, blockName }) => {
                console.log('Creating mesh for block type:', blockName, 'vertices:', geometry.attributes.position.count);
                
                // Get texture for this specific block type
                const texture = getBlockTexture(blockName);
                const material = new THREE.MeshStandardMaterial({ 
                    map: texture,
                    side: THREE.DoubleSide  // Render both sides of faces to prevent invisible faces
                });
                const mesh = new THREE.Mesh(geometry, material);
                
                // Position mesh at chunk origin (vertices are already in world coordinates)
                mesh.position.set(0, 0, 0);
                
                // Store block type and chunk data in userData for reference (used by hover detection)
                mesh.userData.blockName = blockName;
                mesh.userData.chunkData = chunk; // Store chunk data on each mesh for hover detection
                mesh.userData.type = 'block';
                
                chunkGroup.add(mesh);
            });
            
            // Store chunk data reference in userData for block name lookup
            chunkGroup.userData.chunkKey = chunkKey;
            chunkGroup.userData.chunkData = chunk;
            
            scene.add(chunkGroup);
            chunkMeshes.set(chunkKey, chunkGroup);
            console.log('Chunk group added to scene:', chunkKey, 'contains', geometries.length, 'block type(s)');
        }

        // Get facing direction as rotation in radians (for Z rotation after X rotation)
        function getFacingRotation(facing) {
            if (!facing || facing === 'unknown') return 0;
            const facingMap = {
                'north': 0,            // Pointing north (negative Z in Minecraft)
                'south': Math.PI,      // Pointing south (positive Z)
                'east': -Math.PI / 2,  // Pointing east (positive X)
                'west': Math.PI / 2    // Pointing west (negative X)
            };
            return facingMap[facing.toLowerCase()] || 0;
        }

        // Update machine mesh positions with interpolation for smooth movement
        function updateMachineMeshPositions() {
            const currentTime = performance.now();
            
            machineMeshes.forEach((meshGroup, id) => {
                const machine = machines.get(id);
                if (!machine) return;
                
                const entity = entities.get(id);
                const position = entity?.position || machine.status?.position;
                
                if (position && position !== 'unknown' && typeof position === 'object') {
                    const isAndroid = machine.type === 'android';
                    
                    if (isAndroid) {
                        // Androids: Use exact position (no interpolation - too janky)
                        meshGroup.position.set(position.x, position.y - 1, position.z);
                    } else {
                        // Turtles: Use interpolated position for smooth movement
                        const interpolatedPos = getInterpolatedPosition(id, currentTime);
                        if (interpolatedPos) {
                            meshGroup.position.set(interpolatedPos.x, interpolatedPos.y, interpolatedPos.z);
                        } else {
                            // Fallback to exact position if interpolation fails
                            meshGroup.position.set(position.x, position.y, position.z);
                        }
                    }
                }
            });
            
            // Update selection indicator position if a machine is selected
            if (selectedMachineId && selectionMesh) {
                const selectedGroup = machineMeshes.get(selectedMachineId);
                if (selectedGroup) {
                    const cubeCenter = selectedGroup.position.clone();
                    if (selectedGroup.children.length > 0) {
                        const cubeMesh = selectedGroup.children[0];
                        cubeCenter.add(cubeMesh.position);
                    }
                    selectionMesh.position.copy(cubeCenter);
                }
            }
        }
        
        // Create/update machine meshes in 3D scene
        function updateMachineMeshes() {
            // Remove old meshes (but keep selection mesh)
            machineMeshes.forEach((meshGroup) => {
                scene.remove(meshGroup);
            });
            machineMeshes.clear();
            
            // Create meshes for each machine with position
            machines.forEach((machine, id) => {
                const entity = entities.get(id);
                const position = entity?.position || machine.status?.position;
                
                if (position && position !== 'unknown' && typeof position === 'object') {
                    // Create a group to hold the cube and arrow
                    const group = new THREE.Group();
                    
                    // Create a cube to represent the machine
                    // BoxGeometry creates a cube from (-0.5, -0.5, -0.5) to (0.5, 0.5, 0.5)
                    // To align with block grid (blocks go from (x,y,z) to (x+1,y+1,z+1)), 
                    // we offset the cube by 0.5 so its corner is at the position
                    let geometry;
                    if (machine.type === 'android') {
                        geometry = new THREE.BoxGeometry(0.6, 1.8, 0.6); // Player-like proportions
                    } else {
                        geometry = new THREE.BoxGeometry(1, 1, 1);
                    }
                    
                    // Color based on type (support dynamic types)
                    let color = 0x888888;
                    if (machine.type === 'computer') color = 0x2196f3;
                    else if (machine.type === 'android') color = 0xff5722; // Deep orange for android
                    else if (machine.type && machine.type.endsWith('_turtle')) {
                        // Dynamic turtle types - use color based on modifiers
                        if (machine.type.includes('mining')) color = 0x4caf50;
                        else if (machine.type.includes('chatty')) color = 0x9c27b0;
                        else if (machine.type.includes('wireless')) color = 0x9c27b0; // Purple for wireless
                        else color = 0xff9800; // Default orange for basic turtle
                    }
                    
                    const material = new THREE.MeshStandardMaterial({ color: color });
                    const cubeMesh = new THREE.Mesh(geometry, material);
                    if (machine.type === 'android') {
                        // Androids: position so feet are at y=0 (group position y coordinate)
                        // Android is 0.6 wide (from -0.3 to 0.3) and 1.8 tall (from -0.9 to 0.9)
                        // Position mesh so bottom is at y=0 in group space
                        cubeMesh.position.set(0.3, 0.9, 0.3); // Center at (0.3, 0.9, 0.3) so bottom is at y=0
                    } else {
                        cubeMesh.position.set(0.5, 0.5, 0.5); // Offset so corner aligns with block grid
                    }
                    group.add(cubeMesh);
                    
                    // Add facing direction indicator for turtles
